# UI chrome strings (navigation, buttons, labels, headings) for the
# English/German site chrome, per plans/german-translation-plan.md
# Decision 4. NOT for catalog content (problem/solution titles, bodies,
# category keys, or the long home-page intro prose) - those are
# translated directly in their own files/collections.
#
# Usage (wired up in Phase 1, not yet in this commit):
#   {{ site.data.i18n[page.lang | default: site.lang]['nav.problems'] }}
# or via a small `t` include that does the same lookup with an `en`
# fallback when a key is missing for the current language.
#
# Placeholders use a %{name} convention (e.g. "Show %{count} more") -
# whatever templating replaces them at the call site (Liquid `replace`,
# or JS `.replace('%{count}', n)`) is a Phase 1 implementation detail.
