    description_de: Eine Entwicklungspraxis, bei der Entwickler die einfachste und bequemste Lösung wählen statt der angemessensten.
    slug_de: bequemlichkeitsgetriebene-entwicklung
  copy-paste-programming:
    title_de: Copy-Paste-Programmierung
    description_de: Entwickler kopieren häufig Code, statt wiederverwendbare Komponenten zu erstellen.
    slug_de: copy-paste-programmierung
  core-modification-of-standard-software:
