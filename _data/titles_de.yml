# German title/description/slug translation table (plans/german-translation-plan.md,
# Phase 2). Keyed by the ENGLISH slug (the existing filename in _problems/ or
# _solutions/ without .md). This table is the single source of truth for:
#   - the German title/description used when creating the _problems_de/
#     _solutions_de front matter in Phase 3
#   - the German filename (slug_de) for that new file
#   - the link text used whenever another German file links to this one
# German slugs are lowercase/hyphenated per CLAUDE.md, with umlauts
# transliterated (ä→ae, ö→oe, ü→ue, ß→ss) for URL safety, matching existing
# German web conventions. Established English loanwords are kept in German
# titles/descriptions where they're already the common term in German
# software-engineering usage (Decision "Anglizismen bleiben").
#
# Status: work in progress, filled in incrementally in batches. Not yet
# complete for all 452 problems / 561 solutions - see
# plans/german-translation-plan.md Phase 2 progress notes.

problems:
  abi-compatibility-issues:
    title_de: ABI-Kompatibilitätsprobleme
    description_de: Inkompatibilitäten der Binärschnittstelle (ABI) zwischen verschiedenen Versionen von Bibliotheken oder Systemkomponenten führen zu Laufzeitfehlern oder undefiniertem Verhalten.
    slug_de: abi-kompatibilitaetsprobleme
  accumulated-decision-debt:
    title_de: Angehäufte Entscheidungsschulden
    description_de: Aufgeschobene Entscheidungen erzeugen für künftige Entscheidungen zusätzliche Komplexität und machen das System schwerer verständlich und veränderbar.
    slug_de: angehaeufte-entscheidungsschulden
  accumulation-of-workarounds:
    title_de: Anhäufung von Workarounds
    description_de: Statt Kernprobleme zu beheben, schaffen Entwickler aufwendige Workarounds, die Komplexität hinzufügen, ohne die zugrunde liegenden Probleme zu lösen.
    slug_de: anhaeufung-von-workarounds
  algorithmic-complexity-problems:
    title_de: Probleme mit algorithmischer Komplexität
    description_de: Code verwendet ineffiziente Algorithmen oder Datenstrukturen, was zu Performance-Engpässen führt.
    slug_de: probleme-mit-algorithmischer-komplexitaet
  alignment-and-padding-issues:
    title_de: Ausrichtungs- und Padding-Probleme
    description_de: Datenstrukturen haben aufgrund schlechter Ausrichtung und übermäßigem Padding ein ineffizientes Speicherlayout.
    slug_de: ausrichtungs-und-padding-probleme
  analysis-paralysis:
    title_de: Analyse-Lähmung
    description_de: Teams bleiben in Recherchephasen stecken, ohne zur Umsetzung überzugehen, was Fortschritt verhindert.
    slug_de: analyse-laehmung
  api-versioning-conflicts:
    title_de: API-Versionierungskonflikte
    description_de: Inkonsistente oder schlecht verwaltete API-Versionierung erzeugt Kompatibilitätsprobleme und bricht bestehende Integrationen.
    slug_de: api-versionierungskonflikte
  approval-dependencies:
    title_de: Freigabe-Abhängigkeiten
    description_de: Der Arbeitsfortschritt wird häufig durch die Notwendigkeit von Freigaben bestimmter Personen blockiert.
    slug_de: freigabe-abhaengigkeiten
  architectural-mismatch:
    title_de: Architektonische Fehlpassung
    description_de: Neue Geschäftsanforderungen passen nicht gut zu bestehenden architektonischen Einschränkungen.
    slug_de: architektonische-fehlpassung
  assumption-based-development:
    title_de: Annahmenbasierte Entwicklung
    description_de: Entwickler treffen Entscheidungen auf Basis von Annahmen über Anforderungen oder Nutzerbedürfnisse, statt sie zu verifizieren.
    slug_de: annahmenbasierte-entwicklung
  atomic-operation-overhead:
    title_de: Overhead durch atomare Operationen
    description_de: Übermäßiger Einsatz atomarer Operationen erzeugt Performance-Engpässe durch Speicher- und Synchronisationsaufwand.
    slug_de: overhead-durch-atomare-operationen
  authentication-bypass-vulnerabilities:
    title_de: Schwachstellen zur Umgehung der Authentifizierung
