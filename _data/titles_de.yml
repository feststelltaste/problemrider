    slug_de: performance-probleme-bei-datenbankabfragen
  database-schema-design-problems:
    title_de: Probleme im Datenbankschema-Design
    description_de: Schlechtes Datenbankschema-Design erzeugt Performance-Probleme, Datenintegritätsprobleme und Wartungsschwierigkeiten.
    slug_de: probleme-im-datenbankschema-design
  deadline-pressure:
