  delayed-value-delivery:
    title_de: Verzögerte Wertlieferung
    description_de: Nutzer müssen längere Zeit auf neue Funktionen oder Fehlerbehebungen warten, was zu Frustration und Wettbewerbsnachteilen führt.
    slug_de: verzoegerte-wertlieferung
  dependency-on-supplier:
    title_de: Abhängigkeit vom Zulieferer
    description_de: Externe Anbieter kontrollieren kritische Teile des Systems, was die organisatorische Flexibilität verringert und das Lock-in-Risiko erhöht.
    slug_de: abhaengigkeit-vom-zulieferer
  dependency-version-conflicts:
    title_de: Versionskonflikte bei Abhängigkeiten
    description_de: Widersprüchliche Versionen von Abhängigkeiten verursachen Laufzeitfehler, Build-Fehlschläge und unerwartetes Verhalten in Anwendungen.
    slug_de: versionskonflikte-bei-abhaengigkeiten
  deployment-coupling:
    title_de: Deployment-Kopplung
