    slug_de: schwachstellen-zur-umgehung-der-authentifizierung
  author-frustration:
    title_de: Frustration der Autoren
    description_de: Entwickler werden frustriert durch unvorhersehbares, widersprüchliches oder willkürlich wirkendes Feedback.
    slug_de: frustration-der-autoren
  authorization-flaws:
    title_de: Autorisierungsfehler
    description_de: Unzureichende Zugriffskontrollmechanismen erlauben Nutzern, Aktionen auszuführen oder auf Ressourcen zuzugreifen, die ihnen nicht zustehen.
    slug_de: autorisierungsfehler
  authorization-role-explosion:
    title_de: Explosion der Autorisierungsrollen
    description_de: Das Rollen- und Berechtigungsmodell ist auf Tausende von Einträgen angewachsen, die jeweils nur von wenigen Nutzern verwendet werden.
