  development-disruption:
    title_de: Störung der Entwicklung
    description_de: Das Entwicklungsteam wird ständig durch dringende Produktionsprobleme unterbrochen, was geplante Arbeit stört und die Gesamtproduktivität senkt.
    slug_de: stoerung-der-entwicklung
  difficult-code-comprehension:
    title_de: Schwer verständliche Codebasis
    description_de: Eine Situation, in der Entwickler Schwierigkeiten haben, die Codebasis zu verstehen.
    slug_de: schwer-verstaendliche-codebasis
  difficult-code-reuse:
    title_de: Schwierige Code-Wiederverwendung
    description_de: Code lässt sich schwer in anderen Kontexten wiederverwenden, weil er nicht modular und wiederverwendbar gestaltet ist.
    slug_de: schwierige-code-wiederverwendung
  difficult-developer-onboarding:
    title_de: Schwieriges Onboarding neuer Entwickler
    description_de: Neue Teammitglieder brauchen aufgrund komplexer Systeme, schlechter Dokumentation und unzureichender Onboarding-Prozesse ungewöhnlich lange, um produktiv zu werden.
    slug_de: schwieriges-onboarding-neuer-entwickler
  difficult-to-test-code:
    title_de: Schwer testbarer Code
    description_de: Komponenten lassen sich aufgrund enger Kopplung, globaler Abhängigkeiten oder komplexer Voraussetzungen nicht leicht isoliert testen.
    slug_de: schwer-testbarer-code
  difficult-to-understand-code:
    title_de: Schwer verständlicher Code
    description_de: Es ist schwer, den Zweck von Modulen oder Funktionen zu erfassen, ohne viele andere Teile des Systems zu verstehen, was die Entwicklung verlangsamt und Fehler begünstigt.
    slug_de: schwer-verstaendlicher-code
  difficulty-quantifying-benefits:
    title_de: Schwierigkeiten beim Quantifizieren von Nutzen
    description_de: Es ist schwer, den ROI von Refactoring-Arbeit im Vergleich zu neuen Features zu messen, sodass technische Verbesserungen bei Priorisierungsentscheidungen oft den Kürzeren ziehen.
    slug_de: schwierigkeiten-beim-quantifizieren-von-nutzen
  dma-coherency-issues:
    title_de: DMA-Kohärenzprobleme
    description_de: Direct-Memory-Access-Operationen stehen im Konflikt mit der CPU-Cache-Kohärenz, was zu Datenkorruption oder inkonsistenten Datenansichten zwischen CPU und DMA-Geräten führt.
    slug_de: dma-kohaerenzprobleme
  duplicated-effort:
    title_de: Doppelter Aufwand
    description_de: Mehrere Teammitglieder arbeiten unwissentlich an denselben Problemen oder implementieren unabhängig voneinander ähnliche Lösungen.
    slug_de: doppelter-aufwand
  duplicated-research-effort:
    title_de: Doppelter Recherche-Aufwand
    description_de: Mehrere Teammitglieder recherchieren unabhängig voneinander dieselben Themen, was Zeit verschwendet und den Aufbau von kollektivem Wissen verhindert.
    slug_de: doppelter-recherche-aufwand
  duplicated-work:
    title_de: Doppelte Arbeit
    description_de: Mehrere Teammitglieder arbeiten unwissentlich an denselben Aufgaben oder lösen dieselben Probleme, was zu verschwendetem Aufwand und potenziellen Konflikten führt.
    slug_de: doppelte-arbeit
  eager-to-please-stakeholders:
    title_de: Übermäßige Gefälligkeit gegenüber Stakeholdern
    description_de: Das Projektteam stimmt jeder neuen Anfrage der Stakeholder zu, ohne zurückzufragen oder Kompromisse zu erklären, was zu Scope Creep und weiteren Problemen führen kann.
    slug_de: uebermaessige-gefaelligkeit-gegenueber-stakeholdern
  endianness-conversion-overhead:
    title_de: Overhead durch Endianness-Konvertierung
    description_de: Häufige Byte-Reihenfolge-Konvertierungen zwischen unterschiedlichen Endianness-Formaten erzeugen Performance-Overhead bei der Datenverarbeitung und Netzwerkkommunikation.
    slug_de: overhead-durch-endianness-konvertierung
  entity-attribute-value-overuse:
    title_de: Übermäßiger Einsatz von Entity-Attribute-Value
    description_de: Geschäftsdaten werden als generische Attributzeilen statt als typisierte Spalten gespeichert, sodass die Datenbank die gespeicherten Daten nicht mehr erzwingen, indizieren oder erklären kann.
    slug_de: uebermaessiger-einsatz-von-entity-attribute-value
  environment-variable-issues:
    title_de: Probleme mit Umgebungsvariablen
    description_de: Unsachgemäße Verwaltung von Umgebungsvariablen verursacht Konfigurationsprobleme, Sicherheitslücken und Deployment-Fehlschläge.
    slug_de: probleme-mit-umgebungsvariablen
  error-message-information-disclosure:
    title_de: Informationspreisgabe durch Fehlermeldungen
    description_de: Fehlermeldungen geben sensible Systeminformationen preis, die Angreifer nutzen können, um Systemarchitektur und Schwachstellen zu verstehen.
    slug_de: informationspreisgabe-durch-fehlermeldungen
  excessive-class-size:
    title_de: Übermäßige Klassengröße
    description_de: Klassen werden übermäßig groß und komplex, was sie schwer verständlich, wartbar und testbar macht.
    slug_de: uebermaessige-klassengroesse
  excessive-customization:
    title_de: Übermäßige Anpassung
    description_de: So viel kunden- oder standortspezifisches Verhalten häuft sich an, dass keine zwei Installationen gleich sind und jede Änderung gegen jede Variante geprüft werden muss.
    slug_de: uebermaessige-anpassung
  excessive-disk-io:
    title_de: Übermäßige Festplatten-I/O
    description_de: Das System führt eine hohe Anzahl an Festplatten-Lese-/Schreiboperationen aus, was auf ineffizienten Datenzugriff oder ineffiziente Verarbeitung hinweist.
    slug_de: uebermaessige-festplatten-io
  excessive-logging:
    title_de: Übermäßiges Logging
    description_de: Anwendungen erzeugen ein sehr hohes Volumen an Logs, was übermäßigen Speicherplatz verbraucht und potenziell die Performance beeinträchtigt.
    slug_de: uebermaessiges-logging
  excessive-object-allocation:
    title_de: Übermäßige Objektallokation
    description_de: Code erzeugt eine große Anzahl temporärer Objekte, was den Garbage Collector belastet und die Performance verschlechtert.
    slug_de: uebermaessige-objektallokation
  extended-cycle-times:
    title_de: Verlängerte Durchlaufzeiten
    description_de: Die Zeit vom Beginn der Arbeit bis zu ihrer Fertigstellung und Auslieferung wird deutlich länger als die tatsächlich benötigte Arbeitszeit.
    slug_de: verlaengerte-durchlaufzeiten
  extended-research-time:
    title_de: Verlängerte Rechercheszeit
    description_de: Entwickler verbringen einen erheblichen Teil ihres Tages mit Recherche statt mit Umsetzung, aufgrund von Wissenslücken oder komplexen Legacy-Systemen.
    slug_de: verlaengerte-recherchezeit
  extended-review-cycles:
    title_de: Verlängerte Review-Zyklen
    description_de: Code-Reviews erfordern mehrere Runden von Feedback und Überarbeitung, was die Zeit von der Code-Einreichung bis zur Freigabe erheblich verlängert.
    slug_de: verlaengerte-review-zyklen
  external-service-delays:
    title_de: Verzögerungen durch externe Services
    description_de: Eine API hängt von anderen Services (Drittanbieter oder intern) ab, die langsam antworten, was die API selbst langsam macht.
    slug_de: verzoegerungen-durch-externe-services
  false-sharing:
    title_de: False Sharing
    description_de: Mehrere CPU-Kerne greifen auf unterschiedliche Variablen zu, die sich auf derselben Cache-Line befinden, was unnötigen Cache-Kohärenz-Verkehr und Performance-Einbußen verursacht.
    slug_de: false-sharing
  fear-of-breaking-changes:
    title_de: Angst vor Breaking Changes
    description_de: Das Team scheut sich, Änderungen an der Codebasis vorzunehmen, aus Angst, bestehende Funktionalität zu brechen, was zu einem stagnierenden und veralteten System führen kann.
    slug_de: angst-vor-breaking-changes
  fear-of-change:
    title_de: Angst vor Veränderung
    description_de: Entwickler zögern, bestehenden Code zu ändern, aufgrund des hohen Risikos, etwas zu brechen.
    slug_de: angst-vor-veraenderung
  fear-of-conflict:
    title_de: Angst vor Konflikt
    description_de: Reviewer vermeiden es, komplexe Logik oder Designentscheidungen zu hinterfragen, und geben stattdessen einfacheres, weniger konfrontatives Feedback.
    slug_de: angst-vor-konflikt
  fear-of-failure:
    title_de: Angst vor Scheitern
    description_de: Eine allgegenwärtige Angst, Fehler zu machen oder zu scheitern, kann zu Untätigkeit, Risikoscheu und mangelnder Innovationsbereitschaft im Entwicklungsteam führen.
    slug_de: angst-vor-scheitern
  feature-bloat:
    title_de: Feature-Aufblähung
    description_de: Produkte werden durch zahlreiche Funktionen übermäßig komplex, was das Kernwertversprechen verwässert und Nutzer verwirrt.
    slug_de: feature-aufblaehung
  feature-creep-without-refactoring:
    title_de: Feature-Creep ohne Refactoring
    description_de: Die kontinuierliche Ergänzung neuer Funktionen in einer Codebasis, ohne sich Zeit für Refactoring und Designverbesserung zu nehmen.
    slug_de: feature-creep-ohne-refactoring
  feature-creep:
    title_de: Feature-Creep
    description_de: Der Umfang eines Features oder einer Komponente wächst im Laufe der Zeit schrittweise, was zu einem komplexen und aufgeblähten System führt, das schwer zu warten ist.
    slug_de: feature-creep
  feature-factory:
    title_de: Feature-Fabrik
    description_de: Die Organisation priorisiert das Ausliefern von Features gegenüber dem Verständnis ihrer Geschäftswirkung und ihres Nutzerwerts.
    slug_de: feature-fabrik
  feature-gaps:
    title_de: Funktionslücken
    description_de: Wichtige Funktionalität fehlt, weil Entwickler annahmen, sie sei nicht nötig, was zu unvollständigen Lösungen führt, die die Nutzerbedürfnisse nicht erfüllen.
    slug_de: funktionsluecken
  feedback-isolation:
    title_de: Feedback-Isolation
    description_de: Entwicklungsteams arbeiten ohne regelmäßigen Input von Stakeholdern und Nutzern, was zu Produkten führt, die Anforderungen und Nutzerbedürfnisse verfehlen.
    slug_de: feedback-isolation
  flaky-tests:
    title_de: Flaky Tests
    description_de: Tests schlagen zufällig fehl aufgrund von Timing, Setup oder Abhängigkeiten, was das Vertrauen in die Testsuite untergräbt.
    slug_de: flaky-tests
  frequent-changes-to-requirements:
    title_de: Häufige Anforderungsänderungen
    description_de: Die Anforderungen für ein Projekt oder Feature werden ständig aktualisiert, selbst nachdem die Entwicklung begonnen hat, was zu Nacharbeit, Verzögerungen und Frustration führt.
    slug_de: haeufige-anforderungsaenderungen
  frequent-hotfixes-and-rollbacks:
    title_de: Häufige Hotfixes und Rollbacks
    description_de: Das Team deployt ständig kleine Fixes oder macht Releases rückgängig, aufgrund unzureichender Tests und Qualitätskontrolle.
    slug_de: haeufige-hotfixes-und-rollbacks
  garbage-collection-pressure:
    title_de: Garbage-Collection-Druck
    description_de: Übermäßige Objektallokation und -freigabe verursacht häufige Garbage-Collection-Zyklen, was zu Performance-Pausen führt und den Anwendungsdurchsatz verringert.
    slug_de: garbage-collection-druck
  global-state-and-side-effects:
    title_de: Globaler Zustand und Nebeneffekte
    description_de: Übermäßiger Einsatz globaler Variablen oder Funktionen mit versteckten Nebeneffekten erschwert es, das Codeverhalten nachzuvollziehen.
    slug_de: globaler-zustand-und-nebeneffekte
  god-object-anti-pattern:
    title_de: God-Object-Antipattern
    description_de: Einzelne Klassen oder Komponenten übernehmen zu viele Verantwortlichkeiten und werden dadurch übermäßig komplex und schwer zu warten oder zu testen.
    slug_de: god-object-antipattern
  gold-plating:
    title_de: Gold Plating
    description_de: Entwickler fügen einem Projekt unnötige Funktionen oder Komplexität hinzu, weil sie glauben, das würde die Stakeholder beeindrucken, auch wenn es nicht angefragt wurde.
    slug_de: gold-plating
  gradual-performance-degradation:
    title_de: Schleichende Performance-Verschlechterung
    description_de: Die Anwendungsperformance verschlechtert sich im Laufe der Zeit langsam, aufgrund von Ressourcenlecks, angehäuften technischen Schulden oder ineffizienten Algorithmen.
    slug_de: schleichende-performance-verschlechterung
  graphql-complexity-issues:
    title_de: GraphQL-Komplexitätsprobleme
    description_de: GraphQL-Abfragen werden zu komplex oder aufwendig in der Ausführung, was Performance-Probleme und potenzielle Denial-of-Service-Schwachstellen verursacht.
    slug_de: graphql-komplexitaetsprobleme
  growing-task-queues:
    title_de: Wachsende Task-Queues
    description_de: Asynchrone Verarbeitungswarteschlangen häufen unverarbeitete Aufgaben an, was auf einen Engpass in der Verarbeitungspipeline hinweist.
    slug_de: wachsende-task-queues
  hardcoded-values:
    title_de: Hartcodierte Werte
    description_de: Magische Zahlen und feste Zeichenketten verringern die Flexibilität und erschweren Konfiguration und Anpassung.
    slug_de: hartcodierte-werte
  hidden-dependencies:
    title_de: Versteckte Abhängigkeiten
    description_de: Workarounds und Patches erzeugen unerwartete Abhängigkeiten zwischen Systemkomponenten, die aus der Codestruktur nicht ersichtlich sind.
    slug_de: versteckte-abhaengigkeiten
  hidden-side-effects:
    title_de: Versteckte Nebeneffekte
    description_de: Funktionen haben undokumentierte Nebeneffekte, die Zustand verändern oder Aktionen auslösen, die über ihren offensichtlichen Zweck hinausgehen.
    slug_de: versteckte-nebeneffekte
  high-api-latency:
    title_de: Hohe API-Latenz
    description_de: Die Zeit, die eine API zum Antworten auf eine Anfrage benötigt, ist übermäßig lang, was zu schlechter Anwendungsperformance und negativer Nutzererfahrung führt.
    slug_de: hohe-api-latenz
  high-bug-introduction-rate:
    title_de: Hohe Rate an neu eingeführten Fehlern
    description_de: Mit jeder Änderung an der Codebasis werden viele neue Fehler eingeführt, was auf zugrunde liegende Qualitätsprobleme hinweist.
    slug_de: hohe-rate-an-neu-eingefuehrten-fehlern
  high-client-side-resource-consumption:
    title_de: Hoher Ressourcenverbrauch auf Client-Seite
    description_de: Client-Anwendungen verbrauchen übermäßig viel CPU oder Speicher, was zu träger Performance und schlechter Nutzererfahrung führt.
    slug_de: hoher-ressourcenverbrauch-auf-client-seite
  high-connection-count:
    title_de: Hohe Anzahl an Verbindungen
    description_de: Eine große Anzahl offener Datenbankverbindungen, selbst wenn sie inaktiv sind, kann erhebliche Speicherressourcen verbrauchen und zu Verbindungsablehnungen führen.
    slug_de: hohe-anzahl-an-verbindungen
  high-coupling-low-cohesion:
    title_de: Hohe Kopplung und geringe Kohäsion
    description_de: Softwarekomponenten sind übermäßig voneinander abhängig und erfüllen zu viele unzusammenhängende Funktionen, was das System schwer veränderbar und verständlich macht.
    slug_de: hohe-kopplung-und-geringe-kohaesion
  high-database-resource-utilization:
    title_de: Hohe Datenbank-Ressourcennutzung
    description_de: Der Datenbankserver arbeitet durchgängig mit hoher CPU- oder Speichernutzung, was Instabilität riskiert und alle abhängigen Services verlangsamt.
    slug_de: hohe-datenbank-ressourcennutzung
  high-defect-rate-in-production:
    title_de: Hohe Fehlerrate in Produktion
    description_de: Nach einem Release werden in der Produktivumgebung viele Fehler entdeckt, was auf zugrunde liegende Probleme im Entwicklungs- und Qualitätssicherungsprozess hinweist.
    slug_de: hohe-fehlerrate-in-produktion
  high-maintenance-costs:
    title_de: Hohe Wartungskosten
    description_de: Ein unverhältnismäßig großer Teil des Entwicklungsbudgets und -aufwands wird für die Wartung des bestehenden Systems statt für neuen Wert aufgewendet.
    slug_de: hohe-wartungskosten
  high-number-of-database-queries:
    title_de: Hohe Anzahl an Datenbankabfragen
    description_de: Eine einzelne Nutzeranfrage löst eine unerwartet hohe Anzahl an Datenbankabfragen aus, was zu Performance-Verschlechterung und erhöhter Datenbanklast führt.
    slug_de: hohe-anzahl-an-datenbankabfragen
  high-resource-utilization-on-client:
    title_de: Hohe Ressourcennutzung auf dem Client
    description_de: Client-Anwendungen können übermäßig viel CPU oder Speicher verbrauchen, was zu schlechter Nutzererfahrung führt, besonders auf weniger leistungsfähigen Geräten.
    slug_de: hohe-ressourcennutzung-auf-dem-client
  high-technical-debt:
    title_de: Hohe technische Schulden
    description_de: Ansammlung von Design- oder Implementierungsabkürzungen, die langfristig zu erhöhten Kosten und Aufwand führen.
    slug_de: hohe-technische-schulden
  high-turnover:
    title_de: Hohe Fluktuation
    description_de: Neue Entwickler werden frustriert und verlassen das Team aufgrund schlechten Onboardings und Systemkomplexität.
    slug_de: hohe-fluktuation
  history-of-failed-changes:
    title_de: Geschichte fehlgeschlagener Änderungen
    description_de: Eine vergangene Historie fehlgeschlagener Deployments oder Änderungen erzeugt eine Kultur der Angst und des Widerstands gegen künftige Änderungen.
    slug_de: geschichte-fehlgeschlagener-aenderungen
  immature-delivery-strategy:
    title_de: Unausgereifte Auslieferungsstrategie
    description_de: Software-Rollout-Prozesse sind improvisiert, inkonsistent oder unzureichend geplant, was Ausfallzeiten und Nutzerverwirrung erhöht.
    slug_de: unausgereifte-auslieferungsstrategie
  imperative-data-fetching-logic:
    title_de: Imperative Datenabruflogik
    description_de: Der Anwendungscode ist so geschrieben, dass Daten in einer Schleife abgerufen werden, statt einen effizienteren, deklarativen Ansatz zu nutzen, was zu Performance-Problemen führt.
    slug_de: imperative-datenabruflogik
  implementation-partner-dependency:
    title_de: Abhängigkeit vom Implementierungspartner
    description_de: Nur die externe Beratungsfirma versteht, wie das System aufgebaut wurde, sodass die Organisation ihre eigene Installation ohne sie nicht ändern, bewerten oder verlassen kann.
    slug_de: abhaengigkeit-vom-implementierungspartner
  implementation-rework:
    title_de: Implementierungs-Nacharbeit
    description_de: Funktionen müssen neu gebaut werden, wenn sich das anfängliche Verständnis als falsch erweist, was Entwicklungsaufwand verschwendet und die Auslieferung verzögert.
    slug_de: implementierungs-nacharbeit
  implementation-starts-without-design:
    title_de: Implementierung beginnt ohne Design
    description_de: Die Entwicklung beginnt mit unklarer Struktur, was zu unorganisiertem Code und architektonischer Drift führt.
    slug_de: implementierung-beginnt-ohne-design
  implicit-knowledge:
    title_de: Implizites Wissen
    description_de: Kritisches Systemwissen existiert als ungeschriebene Annahmen, Stammeswissen und undokumentierte Praktiken, statt explizit festgehalten zu sein.
    slug_de: implizites-wissen
  improper-event-listener-management:
    title_de: Unsachgemäße Verwaltung von Event-Listenern
    description_de: Event-Listener werden hinzugefügt, aber nicht entfernt, wenn zugehörige Objekte zerstört werden, was Speicherlecks erzeugt und Garbage Collection verhindert.
    slug_de: unsachgemaesse-verwaltung-von-event-listenern
  inability-to-innovate:
    title_de: Unfähigkeit zu innovieren
    description_de: Das Team ist so sehr mit alltäglichen Wartungsaufgaben beschäftigt, dass es keine Zeit hat, über zukünftige Verbesserungen oder neue Ansätze nachzudenken.
    slug_de: unfaehigkeit-zu-innovieren
  inadequate-code-reviews:
    title_de: Unzureichende Code-Reviews
    description_de: Code-Reviews werden nicht konsistent durchgeführt, sind übereilt, oberflächlich oder erkennen kritische Probleme nicht, was die Codequalität senkt und das Risiko erhöht.
    slug_de: unzureichende-code-reviews
  inadequate-configuration-management:
    title_de: Unzureichendes Konfigurationsmanagement
    description_de: Versionen von Code, Daten oder Infrastruktur werden nicht ordentlich nachverfolgt, was zu Fehlern oder Problemen bei Rollbacks führt.
    slug_de: unzureichendes-konfigurationsmanagement
  inadequate-error-handling:
    title_de: Unzureichende Fehlerbehandlung
    description_de: Schlechte Fehlerbehandlungsmechanismen schaffen es nicht, Ausnahmen geordnet zu handhaben, was zu Anwendungsabstürzen und schlechter Nutzererfahrung führt.
    slug_de: unzureichende-fehlerbehandlung
  inadequate-initial-reviews:
    title_de: Unzureichende Erst-Reviews
    description_de: Code-Reviews der ersten Runde sind unvollständig oder oberflächlich und erkennen wichtige Probleme nicht, die erst in späteren Review-Runden entdeckt werden.
    slug_de: unzureichende-erst-reviews
  inadequate-integration-tests:
    title_de: Unzureichende Integrationstests
    description_de: Die Interaktionen zwischen verschiedenen Modulen oder Services werden nicht gründlich getestet, was zu Integrationsfehlern führt.
    slug_de: unzureichende-integrationstests
  inadequate-mentoring-structure:
    title_de: Unzureichende Mentoring-Struktur
    description_de: Der Organisation fehlt ein systematischer Ansatz für das Mentoring neuer Entwickler, was zu uneinheitlicher Anleitung und Unterstützung führt.
    slug_de: unzureichende-mentoring-struktur
  inadequate-onboarding:
    title_de: Unzureichendes Onboarding
    description_de: Neue Nutzer haben Schwierigkeiten zu verstehen, wie die Anwendung zu nutzen ist, was zu frühzeitiger Abwanderung führt.
    slug_de: unzureichendes-onboarding
  inadequate-requirements-gathering:
    title_de: Unzureichende Anforderungserhebung
    description_de: Unzureichende Analyse und Dokumentation von Anforderungen führt zu Lösungen, die tatsächliche Bedürfnisse nicht erfüllen.
    slug_de: unzureichende-anforderungserhebung
  inadequate-test-data-management:
    title_de: Unzureichendes Testdatenmanagement
    description_de: Die Nutzung unrealistischer, veralteter oder unzureichender Testdaten führt zu Tests, die reale Szenarien nicht akkurat abbilden.
    slug_de: unzureichendes-testdatenmanagement
  inadequate-test-infrastructure:
    title_de: Unzureichende Testinfrastruktur
    description_de: Fehlende Werkzeuge, Umgebungen oder Automatisierung machen gründliches Testen langsam oder unmöglich.
    slug_de: unzureichende-testinfrastruktur
  inappropriate-skillset:
    title_de: Unpassendes Fähigkeitsprofil
    description_de: Teammitgliedern fehlt wesentliches Wissen oder Erfahrung, das für ihre zugewiesenen Rollen und Verantwortlichkeiten nötig ist.
    slug_de: unpassendes-faehigkeitsprofil
  incomplete-knowledge:
    title_de: Unvollständiges Wissen
    description_de: Entwicklern ist nicht bewusst, an welchen Stellen überall ähnliche Logik existiert, was zu Synchronisationsproblemen und anderen Schwierigkeiten führen kann.
    slug_de: unvollstaendiges-wissen
  incomplete-projects:
    title_de: Unvollständige Projekte
    description_de: Funktionen werden begonnen, aber aufgrund sich verändernder Prioritäten nie fertiggestellt, was zu erheblichem verschwendetem Aufwand und Frustration im Entwicklungsteam führt.
    slug_de: unvollstaendige-projekte
  inconsistent-behavior:
    title_de: Inkonsistentes Verhalten
    description_de: Derselbe Geschäftsprozess erzeugt je nach Auslösungsort unterschiedliche Ergebnisse, was zu einer verwirrenden und unvorhersehbaren Nutzererfahrung führt.
    slug_de: inkonsistentes-verhalten
  inconsistent-codebase:
    title_de: Inkonsistente Codebasis
    description_de: Dem Projektcode fehlt einheitlicher Stil, fehlen einheitliche Coding-Standards und Designmuster, was ihn schwer lesbar, wartbar macht und das Onboarding neuer Entwickler erschwert.
    slug_de: inkonsistente-codebasis
  inconsistent-coding-standards:
    title_de: Inkonsistente Coding-Standards
    description_de: Das Fehlen einheitlicher Coding-Standards in der gesamten Codebasis erzeugt Wartungsschwierigkeiten und verringert Lesbarkeit und Qualität des Codes.
    slug_de: inkonsistente-coding-standards
  inconsistent-execution:
    title_de: Inkonsistente Ausführung
    description_de: Manuelle Prozesse führen zu Abweichungen darin, wie Aufgaben von verschiedenen Teammitgliedern und im Zeitverlauf erledigt werden, was unvorhersehbare Ergebnisse erzeugt.
    slug_de: inkonsistente-ausfuehrung
  inconsistent-knowledge-acquisition:
    title_de: Inkonsistenter Wissenserwerb
    description_de: Neue Teammitglieder lernen je nach Mentor oder Lernpfad unterschiedliche Aspekte und Tiefen des Systemwissens, was zu ungleicher Kompetenzverteilung führt.
    slug_de: inkonsistenter-wissenserwerb
  inconsistent-naming-conventions:
    title_de: Inkonsistente Namenskonventionen
    description_de: Unstrukturierte oder widersprüchliche Namen erschweren das Lesen, Navigieren und Warten von Code.
    slug_de: inkonsistente-namenskonventionen
  inconsistent-onboarding-experience:
    title_de: Inkonsistente Onboarding-Erfahrung
    description_de: Neue Teammitglieder erhalten je nachdem, wer gerade verfügbar ist, um zu helfen, drastisch unterschiedliche Onboarding-Erfahrungen, was zu ungleichen Ergebnissen führt.
    slug_de: inkonsistente-onboarding-erfahrung
  inconsistent-quality:
    title_de: Inkonsistente Qualität
    description_de: Manche Teile des Systems sind gut gepflegt, während andere verfallen, was zu unvorhersehbarer Nutzererfahrung und Wartungsherausforderungen führt.
    slug_de: inkonsistente-qualitaet
  incorrect-index-type:
    title_de: Falscher Index-Typ
    description_de: Verwendung eines für ein gegebenes Abfragemuster ungeeigneten Datenbank-Index-Typs, was zu ineffizientem Datenabruf führt.
    slug_de: falscher-index-typ
  incorrect-max-connection-pool-size:
    title_de: Falsche maximale Connection-Pool-Größe
    description_de: Die maximale Anzahl an Verbindungen in einem Datenbank-Connection-Pool ist falsch eingestellt, was entweder zu Ressourcenverschwendung oder Verbindungserschöpfung führt.
    slug_de: falsche-maximale-connection-pool-groesse
  increased-bug-count:
    title_de: Erhöhte Fehleranzahl
    description_de: Änderungen führen häufiger zu neuen Defekten, was zu einer höheren Fehlerrate in der Produktion und verschlechterter Softwarequalität führt.
    slug_de: erhoehte-fehleranzahl
  increased-cognitive-load:
    title_de: Erhöhte kognitive Last
    description_de: Entwickler müssen übermäßig viel mentale Energie aufwenden, um inkonsistenten, komplexen oder schlecht strukturierten Code zu verstehen und mit ihm zu arbeiten.
    slug_de: erhoehte-kognitive-last
  increased-cost-of-development:
    title_de: Erhöhte Entwicklungskosten
    description_de: Die Kosten, Fehler zu beheben und schlechten Code zu warten, sind deutlich höher, als Probleme von Anfang an zu vermeiden.
    slug_de: erhoehte-entwicklungskosten
  increased-customer-support-load:
    title_de: Erhöhte Last im Kundensupport
    description_de: Nutzer kontaktieren den Support häufiger aufgrund von Frustration oder der Unfähigkeit, Aufgaben abzuschließen.
    slug_de: erhoehte-last-im-kundensupport
  increased-error-rates:
    title_de: Erhöhte Fehlerraten
    description_de: Ein ungewöhnlicher oder anhaltender Anstieg der Häufigkeit von Fehlern, die von einer Anwendung oder einem Service gemeldet werden.
    slug_de: erhoehte-fehlerraten
  increased-manual-testing-effort:
    title_de: Erhöhter manueller Testaufwand
    description_de: Ein unverhältnismäßig großer Teil der Zeit wird aufgrund fehlender Automatisierung für manuelles Testen aufgewendet.
    slug_de: erhoehter-manueller-testaufwand
  increased-manual-work:
    title_de: Erhöhte manuelle Arbeit
    description_de: Entwickler verbringen Zeit mit repetitiven Aufgaben, die automatisiert werden sollten, was die für tatsächliche Entwicklungsarbeit verfügbare Zeit verringert.
    slug_de: erhoehte-manuelle-arbeit
  increased-risk-of-bugs:
    title_de: Erhöhtes Risiko für Fehler
    description_de: Codekomplexität und mangelnde Klarheit erhöhen die Wahrscheinlichkeit, dass Entwickler bei Änderungen Defekte einführen.
    slug_de: erhoehtes-risiko-fuer-fehler
  increased-stress-and-burnout:
    title_de: Erhöhter Stress und Burnout
    description_de: Teammitglieder sind aufgrund unrealistischer Erwartungen und Zeitdrucks überlastet und gestresst, was Moral und Produktivität senkt.
    slug_de: erhoehter-stress-und-burnout
  increased-technical-shortcuts:
    title_de: Zunehmende technische Abkürzungen
    description_de: Der Druck zu liefern führt zu mehr schnellen Fixes und Workarounds statt richtiger Lösungen, was künftige Wartungsprobleme schafft.
    slug_de: zunehmende-technische-abkuerzungen
  increased-time-to-market:
    title_de: Erhöhte Time-to-Market
    description_de: Es dauert länger, neue Funktionen und Produkte auf den Markt zu bringen, was potenziell zu Wettbewerbsnachteilen und entgangenen Umsatzmöglichkeiten führt.
    slug_de: erhoehte-time-to-market
  increasing-brittleness:
    title_de: Zunehmende Brüchigkeit
    description_de: Softwaresysteme werden im Laufe der Zeit fragiler und anfälliger für Ausfälle, wobei kleine Änderungen unvorhersehbare und weitreichende Auswirkungen haben.
    slug_de: zunehmende-bruechigkeit
  index-fragmentation:
    title_de: Index-Fragmentierung
    description_de: Im Laufe der Zeit, während Daten eingefügt, aktualisiert und gelöscht werden, werden Datenbank-Indizes unorganisiert, was ihre Effizienz verringert.
    slug_de: index-fragmentierung
  individual-recognition-culture:
    title_de: Kultur der individuellen Anerkennung
    description_de: Eine Kultur, in der individuelle Leistungen mehr geschätzt werden als Teamleistungen.
    slug_de: kultur-der-individuellen-anerkennung
  inefficient-code:
    title_de: Ineffizienter Code
    description_de: Der Code, der für die Bearbeitung einer Anfrage zuständig ist, ist rechenintensiv oder enthält Performance-Engpässe.
    slug_de: ineffizienter-code
  inefficient-database-indexing:
    title_de: Ineffiziente Datenbankindizierung
    description_de: Der Datenbank fehlen geeignete Indizes für gängige Abfragemuster, was langsame Full-Table-Scans für Datenabrufoperationen erzwingt.
    slug_de: ineffiziente-datenbankindizierung
  inefficient-development-environment:
    title_de: Ineffiziente Entwicklungsumgebung
    description_de: Das Team wird durch eine langsame und umständliche Entwicklungsumgebung ausgebremst.
    slug_de: ineffiziente-entwicklungsumgebung
  inefficient-frontend-code:
    title_de: Ineffizienter Frontend-Code
    description_de: Unoptimiertes JavaScript, übermäßige DOM-Manipulation oder komplexe CSS-Animationen, die rechenintensiv sind.
    slug_de: ineffizienter-frontend-code
  inefficient-processes:
    title_de: Ineffiziente Prozesse
    description_de: Schlechte Arbeitsabläufe, übermäßige Meetings oder bürokratische Verfahren verschwenden Entwicklungszeit und verringern die Teamproduktivität.
    slug_de: ineffiziente-prozesse
  inexperienced-developers:
    title_de: Unerfahrene Entwickler
    description_de: Dem Entwicklungsteam fehlen das Wissen und die Erfahrung, um bewährte Praktiken und wartbare Lösungen umzusetzen.
    slug_de: unerfahrene-entwickler
  information-decay:
    title_de: Informationsverfall
    description_de: Systemdokumentation wird im Laufe der Zeit veraltet, ungenau oder unvollständig, was sie für Entscheidungsfindung und Systemverständnis unzuverlässig macht.
    slug_de: informationsverfall
  information-fragmentation:
    title_de: Informationsfragmentierung
    description_de: Kritisches Systemwissen ist über mehrere Orte und Formate verstreut, was es schwer auffindbar und pflegbar macht.
    slug_de: informationsfragmentierung
  insecure-data-transmission:
    title_de: Unsichere Datenübertragung
    description_de: Sensible Daten werden ohne angemessene Verschlüsselung oder Sicherheitskontrollen übertragen, was sie Abhören und unbefugtem Zugriff aussetzt.
    slug_de: unsichere-datenuebertragung
  insufficient-audit-logging:
    title_de: Unzureichendes Audit-Logging
    description_de: Unzureichende Protokollierung sicherheitsrelevanter Ereignisse erschwert es, Einbrüche zu erkennen, Vorfälle zu untersuchen oder Compliance einzuhalten.
    slug_de: unzureichendes-audit-logging
  insufficient-code-review:
    title_de: Unzureichendes Code-Review
    description_de: Code-Review-Prozesse übersehen Designfehler, Bugs oder Qualitätsprobleme aufgrund unzureichender Tiefe, Zeit oder Expertise.
    slug_de: unzureichendes-code-review
  insufficient-design-skills:
    title_de: Unzureichende Design-Fähigkeiten
    description_de: Dem Entwicklungsteam fehlen die nötigen Fähigkeiten und Erfahrung, um gut strukturierte, wartbare Software zu entwerfen und zu bauen.
    slug_de: unzureichende-design-faehigkeiten
  insufficient-testing:
    title_de: Unzureichendes Testen
    description_de: Der Testprozess ist nicht umfassend genug, was zu einer hohen Fehlerrate in der Produktion führt.
    slug_de: unzureichendes-testen
  insufficient-worker-capacity:
    title_de: Unzureichende Worker-Kapazität
    description_de: Es gibt nicht genügend Worker-Prozesse oder Threads, um das eingehende Aufgabenvolumen in einem asynchronen System zu bewältigen, was zu wachsenden Warteschlangen führt.
    slug_de: unzureichende-worker-kapazitaet
  integer-overflow-underflow:
    title_de: Integer-Überlauf und -Unterlauf
    description_de: Arithmetische Operationen erzeugen Ergebnisse, die die durch Integer-Datentypen darstellbaren Maximal- oder Minimalwerte überschreiten, was zu unerwartetem Verhalten führt.
    slug_de: integer-ueberlauf-und-unterlauf
  integration-difficulties:
    title_de: Integrationsschwierigkeiten
    description_de: Die Anbindung an moderne Services erfordert aufgrund architektonischer Einschränkungen oder veralteter Integrationsmuster umfangreiche Workarounds.
    slug_de: integrationsschwierigkeiten
  interrupt-overhead:
    title_de: Interrupt-Overhead
    description_de: Übermäßige Hardware-Interrupts stören den CPU-Ausführungsfluss, was zu häufigen Kontextwechseln führt und die Anwendungsperformance verringert.
    slug_de: interrupt-overhead
  invisible-nature-of-technical-debt:
    title_de: Unsichtbarkeit technischer Schulden
    description_de: Die Auswirkung technischer Schulden ist für nicht-technische Stakeholder nicht sichtbar, was es schwer macht, ihre Behebung zu rechtfertigen und Ressourcen dafür bereitzustellen.
    slug_de: unsichtbarkeit-technischer-schulden
  knowledge-dependency:
    title_de: Wissensabhängigkeit
    description_de: Teammitglieder bleiben länger als für ihre Rolle und Betriebszugehörigkeit angemessen von bestimmten erfahrenen Personen für Wissen und Entscheidungsfindung abhängig.
    slug_de: wissensabhaengigkeit
  knowledge-gaps:
    title_de: Wissenslücken
    description_de: Mangelndes Verständnis von Systemen, Geschäftsanforderungen oder technischen Domänen führt zu verlängerter Rechercheszeit und suboptimalen Lösungen.
    slug_de: wissensluecken
  knowledge-sharing-breakdown:
    title_de: Zusammenbruch des Wissensaustauschs
    description_de: Der Prozess des Wissens- und Erfahrungsaustauschs zwischen Teammitgliedern ist ineffektiv, was zu Informationssilos und verringertem Teamlernen führt.
    slug_de: zusammenbruch-des-wissensaustauschs
  knowledge-silos:
    title_de: Wissenssilos
    description_de: Wichtige Rechercheergebnisse und Expertise bleiben auf einzelne Teammitglieder beschränkt, was Wissensaustausch und Teamlernen verhindert.
    slug_de: wissenssilos
  lack-of-ownership-and-accountability:
    title_de: Fehlende Eigenverantwortung und Rechenschaftspflicht
    description_de: Keine klare Verantwortlichkeit für die Pflege von Codequalität, Dokumentation oder bestimmten Systemkomponenten im Zeitverlauf.
    slug_de: fehlende-eigenverantwortung-und-rechenschaftspflicht
  language-barriers:
    title_de: Sprachbarrieren
    description_de: Unterschiede in Sprache oder Terminologie behindern reibungslose Kommunikation und Verständnis im Team.
    slug_de: sprachbarrieren
  large-estimates-for-small-changes:
    title_de: Große Schätzungen für kleine Änderungen
    description_de: Das Team liefert durchgängig große Zeitschätzungen für scheinbar kleine Änderungen, was auf zugrunde liegende Codekomplexität und Risiko hinweist.
    slug_de: grosse-schaetzungen-fuer-kleine-aenderungen
  large-feature-scope:
    title_de: Großer Feature-Umfang
    description_de: Features sind zu groß, um in kleinere, inkrementelle Änderungen zerlegt zu werden, was zu langlebigen Branches und Integrationsproblemen führt.
    slug_de: grosser-feature-umfang
  large-pull-requests:
    title_de: Große Pull Requests
    description_de: Pull Requests sind zu groß, um effektiv geprüft zu werden, was zu oberflächlichen Reviews und übersehenen Problemen führt.
    slug_de: grosse-pull-requests
  large-risky-releases:
    title_de: Große, riskante Releases
    description_de: Seltene Releases führen zu großen, komplexen Deployments, die schwer zu testen sind, anfällig für Fehlschläge sind und erhebliche Auswirkungen auf Nutzer haben, wenn sie schiefgehen.
    slug_de: grosse-riskante-releases
  lazy-loading:
    title_de: Lazy Loading
    description_de: Die Nutzung von Lazy Loading in einem ORM-Framework führt zu einer großen Anzahl unnötiger Datenbankabfragen, was die Anwendungsperformance erheblich verschlechtern kann.
    slug_de: lazy-loading
  legacy-api-versioning-nightmare:
    title_de: Albtraum der Legacy-API-Versionierung
    description_de: Legacy-Systeme mit schlecht gestalteten APIs schaffen Versionierungs- und Abwärtskompatibilitätsherausforderungen, die sich im Laufe der Zeit verstärken.
    slug_de: albtraum-der-legacy-api-versionierung
  legacy-business-logic-extraction-difficulty:
    title_de: Schwierigkeit bei der Extraktion von Legacy-Geschäftslogik
    description_de: Kritische Geschäftsregeln sind tief in Legacy-Codestrukturen eingebettet, was sie nahezu unmöglich zu identifizieren und zu extrahieren macht.
    slug_de: schwierigkeit-bei-der-extraktion-von-legacy-geschaeftslogik
  legacy-code-without-tests:
    title_de: Legacy-Code ohne Tests
    description_de: Bestehende Legacy-Systeme haben oft keine automatisierten Tests, was es schwierig macht, sie schrittweise hinzuzufügen und den Code sicher zu ändern.
    slug_de: legacy-code-ohne-tests
  legacy-configuration-management-chaos:
    title_de: Chaos im Legacy-Konfigurationsmanagement
    description_de: Konfigurationseinstellungen sind hartcodiert, undokumentiert oder in proprietären Formaten gespeichert, die moderne Deployment-Praktiken verhindern.
    slug_de: chaos-im-legacy-konfigurationsmanagement
  legacy-skill-shortage:
    title_de: Mangel an Legacy-Fachkräften
    description_de: Ein kritischer Mangel an Entwicklern mit Kenntnissen über Legacy-Technologien erzeugt Engpässe und Single Points of Failure für die Systemwartung.
    slug_de: mangel-an-legacy-fachkraeften
  legacy-system-documentation-archaeology:
    title_de: Dokumentations-Archäologie bei Legacy-Systemen
    description_de: Kritisches Systemwissen existiert nur in veralteten Dokumentationsformaten, überholten Diagrammen und dem Stammeswissen ausgeschiedener Mitarbeiter.
    slug_de: dokumentations-archaeologie-bei-legacy-systemen
  legal-disputes:
    title_de: Rechtsstreitigkeiten
    description_de: Konflikte über Verträge, Liefergegenstände oder Verantwortlichkeiten eskalieren zu Rechtsverfahren, was Ressourcen verbraucht und Beziehungen schädigt.
    slug_de: rechtsstreitigkeiten
  limited-team-learning:
    title_de: Begrenztes Teamlernen
    description_de: Eine Situation, in der ein Team nicht aus seinen Fehlern lernt und sich im Laufe der Zeit nicht verbessert.
    slug_de: begrenztes-teamlernen
  load-balancing-problems:
    title_de: Probleme beim Load Balancing
    description_de: Load-Balancing-Mechanismen verteilen Traffic ineffizient oder passen sich nicht an sich ändernde Bedingungen an, was Performance-Probleme und Service-Instabilität verursacht.
    slug_de: probleme-beim-load-balancing
  lock-contention:
    title_de: Lock Contention
    description_de: Mehrere Threads konkurrieren um dieselben Locks, was Threads blockiert und die Effizienz paralleler Ausführung verringert.
    slug_de: lock-contention
  log-injection-vulnerabilities:
    title_de: Log-Injection-Schwachstellen
    description_de: Unbereinigte Nutzereingaben in Log-Nachrichten erlauben Angreifern, bösartigen Inhalt einzuschleusen, der die Log-Integrität kompromittieren oder Log-Verarbeitungssysteme ausnutzen kann.
    slug_de: log-injection-schwachstellen
  log-spam:
    title_de: Log-Spam
    description_de: Die Anwendungs- oder Datenbank-Logs werden mit einer großen Anzahl ähnlich aussehender Abfragen überflutet, was es schwierig macht, andere Probleme zu erkennen und zu diagnostizieren.
    slug_de: log-spam
  logging-configuration-issues:
    title_de: Probleme bei der Logging-Konfiguration
    description_de: Unsachgemäße Logging-Konfiguration führt zu fehlenden kritischen Informationen, übermäßigem Log-Volumen oder Sicherheitslücken.
    slug_de: probleme-bei-der-logging-konfiguration
  long-build-and-test-times:
    title_de: Lange Build- und Testzeiten
    description_de: Eine Situation, in der es lange dauert, ein System zu bauen und zu testen.
    slug_de: lange-build-und-testzeiten
  long-lived-feature-branches:
    title_de: Langlebige Feature-Branches
    description_de: Code wird nicht zeitnah geprüft und gemergt, was zu Integrationsproblemen und erhöhtem Risiko führt.
    slug_de: langlebige-feature-branches
  long-release-cycles:
    title_de: Lange Release-Zyklen
    description_de: Releases verzögern sich aufgrund langwieriger manueller Testphasen oder in letzter Minute entdeckter Fehler.
    slug_de: lange-release-zyklen
  long-running-database-transactions:
    title_de: Lang laufende Datenbanktransaktionen
    description_de: Datenbanktransaktionen bleiben über längere Zeiträume offen, halten Locks und verbrauchen Ressourcen, was andere Operationen blockieren kann.
    slug_de: lang-laufende-datenbanktransaktionen
  long-running-transactions:
    title_de: Lang laufende Transaktionen
    description_de: Datenbanktransaktionen, die über längere Zeit offen bleiben, können Locks halten, Ressourcen verbrauchen und andere Operationen blockieren.
    slug_de: lang-laufende-transaktionen
  low-code-customization-sprawl:
    title_de: Wildwuchs bei Low-Code-Anpassungen
    description_de: Geschäftslogik häuft sich im eigenen Skripting- und Workflow-Tooling einer Plattform an, wo sie sich Tests, Reviews und jeder anderen Engineering-Praxis entzieht.
    slug_de: wildwuchs-bei-low-code-anpassungen
  lower-code-quality:
    title_de: Geringere Codequalität
    description_de: Ausgebrannte oder gehetzte Entwickler machen mit höherer Wahrscheinlichkeit Fehler, was zu einer Zunahme von Defekten führt.
    slug_de: geringere-codequalitaet
  maintenance-bottlenecks:
    title_de: Wartungsengpässe
    description_de: Eine Situation, in der nur eine kleine Anzahl von Entwicklern Änderungen an einem kritischen Teil des Systems vornehmen kann.
    slug_de: wartungsengpaesse
  maintenance-cost-increase:
    title_de: Anstieg der Wartungskosten
    description_de: Die für Wartung, Support und Aktualisierung von Softwaresystemen benötigten Ressourcen wachsen im Laufe der Zeit und verbrauchen zunehmend größere Teile der Entwicklungsbudgets.
    slug_de: anstieg-der-wartungskosten
  maintenance-overhead:
    title_de: Wartungs-Overhead
    description_de: Ein unverhältnismäßig großer Teil der Zeit und des Aufwands wird für die Wartung des bestehenden Systems aufgewendet, oft aufgrund von dupliziertem Code und fehlenden wiederverwendbaren Komponenten.
    slug_de: wartungs-overhead
  maintenance-paralysis:
    title_de: Wartungslähmung
    description_de: Teams vermeiden notwendige Verbesserungen, weil sie nicht verifizieren können, dass Änderungen bestehende Funktionalität nicht brechen.
    slug_de: wartungslaehmung
  manual-deployment-processes:
    title_de: Manuelle Deployment-Prozesse
    description_de: Releases erfordern menschliches Eingreifen, was die Wahrscheinlichkeit für Fehler und Inkonsistenzen erhöht.
    slug_de: manuelle-deployment-prozesse
  market-pressure:
    title_de: Marktdruck
    description_de: Externe Wettbewerbskräfte oder Marktbedingungen treiben übereilte Entscheidungen, Scope-Änderungen und unrealistische Erwartungen an.
    slug_de: marktdruck
  master-data-ownership-gaps:
    title_de: Lücken in der Verantwortlichkeit für Stammdaten
    description_de: Zentrale Referenzdaten werden über Module und Abteilungen hinweg geteilt, ohne dass es einen Verantwortlichen gibt, sodass ihre Qualität sich verschlechtert und niemand für die Korrektur zuständig ist.
    slug_de: luecken-in-der-verantwortlichkeit-fuer-stammdaten
  memory-barrier-inefficiency:
    title_de: Ineffizienz von Memory Barriers
    description_de: Übermäßige oder falsch platzierte Memory Barriers stören die CPU-Pipeline-Optimierung und verringern die Performance in Multithreading-Anwendungen.
    slug_de: ineffizienz-von-memory-barriers
  memory-fragmentation:
    title_de: Speicherfragmentierung
    description_de: Verfügbarer Speicher wird in kleine, nicht zusammenhängende Blöcke aufgeteilt, was die Allokation größerer Objekte trotz ausreichendem Gesamtspeicher verhindert.
    slug_de: speicherfragmentierung
  memory-leaks:
    title_de: Speicherlecks
    description_de: Anwendungen geben nicht mehr benötigten Speicher nicht frei, was zu allmählich steigendem Speicherverbrauch und schließlich zu Performance-Verschlechterung oder Abstürzen führt.
    slug_de: speicherlecks
  memory-swapping:
    title_de: Memory Swapping
    description_de: Dem Datenbankserver geht der physische Speicher aus und er beginnt, Festplatten-Swap-Speicher zu nutzen, was die Performance drastisch verlangsamt.
    slug_de: memory-swapping
  mental-fatigue:
    title_de: Mentale Erschöpfung
    description_de: Entwickler berichten, sich erschöpft und mental ausgelaugt zu fühlen, ohne wesentliche Arbeit zu erledigen, oft aufgrund kognitiven Overheads und ineffizienter Arbeitsabläufe.
    slug_de: mentale-erschoepfung
  mentor-burnout:
    title_de: Mentoren-Burnout
    description_de: Erfahrene Teammitglieder werden durch übermäßige Mentoring- und Wissenstransferverantwortung überfordert und erschöpft.
    slug_de: mentoren-burnout
  merge-conflicts:
    title_de: Merge-Konflikte
    description_de: Mehrere Entwickler ändern häufig dieselben großen Funktionen oder Dateien, was Versionskontrollkonflikte erzeugt, die die Entwicklung verlangsamen.
    slug_de: merge-konflikte
  micromanagement-culture:
    title_de: Mikromanagement-Kultur
    description_de: Eine Management-Kultur, die Genehmigungen für Routineentscheidungen verlangt, was die Teamautonomie verringert und unnötige Engpässe schafft.
    slug_de: mikromanagement-kultur
  microservice-communication-overhead:
    title_de: Kommunikations-Overhead zwischen Microservices
    description_de: Übermäßige Netzwerkkommunikation zwischen Microservices erzeugt Latenz, verringert Zuverlässigkeit und beeinträchtigt die Gesamtsystemperformance.
    slug_de: kommunikations-overhead-zwischen-microservices
  misaligned-deliverables:
    title_de: Fehlausgerichtete Liefergegenstände
    description_de: Das gelieferte Produkt oder Feature entspricht nicht den Erwartungen oder Anforderungen der Stakeholder.
    slug_de: fehlausgerichtete-liefergegenstaende
  misconfigured-connection-pools:
    title_de: Falsch konfigurierte Connection Pools
    description_de: Anwendungs-Connection-Pools sind unsachgemäß eingerichtet, was zu ineffizienter Ressourcennutzung oder Verbindungserschöpfung führt.
    slug_de: falsch-konfigurierte-connection-pools
  missed-deadlines:
    title_de: Verpasste Termine
    description_de: Projekte überschreiten regelmäßig ihre geschätzten Fertigstellungszeiten und Teams verfehlen durchgängig Sprintziele und Lieferzusagen.
    slug_de: verpasste-termine
  missing-end-to-end-tests:
    title_de: Fehlende End-to-End-Tests
    description_de: Vollständige Nutzerabläufe werden nicht von Anfang bis Ende getestet, wodurch workflow-brechende Fehler in die Produktion gelangen.
    slug_de: fehlende-end-to-end-tests
  missing-rollback-strategy:
    title_de: Fehlende Rollback-Strategie
    description_de: Es gibt keine getestete Methode, ein Deployment rückgängig zu machen, wenn etwas schiefgeht, was das Risiko erhöht.
    slug_de: fehlende-rollback-strategie
  misunderstanding-of-oop:
    title_de: Missverständnis der Objektorientierung
    description_de: Mangelndes Verständnis der grundlegenden Prinzipien der objektorientierten Programmierung kann zu schlecht designtem und schwer wartbarem Code führen.
    slug_de: missverstaendnis-der-objektorientierung
  mixed-coding-styles:
    title_de: Gemischte Coding-Stile
    description_de: Eine Situation, in der unterschiedliche Teile der Codebasis unterschiedliche Formatierung, Namenskonventionen und Designmuster verwenden.
    slug_de: gemischte-coding-stile
  modernization-roi-justification-failure:
    title_de: Scheiternde ROI-Rechtfertigung für Modernisierung
    description_de: Unfähigkeit, überzeugende Business Cases für die Modernisierung von Legacy-Systemen aufzubauen, aufgrund versteckter technischer Schulden und unklarer Nutzenquantifizierung.
    slug_de: scheiternde-roi-rechtfertigung-fuer-modernisierung
  modernization-strategy-paralysis:
    title_de: Lähmung der Modernisierungsstrategie
    description_de: Teams werden von Modernisierungsoptionen (Neuschreiben, Refactoring, Ersetzen, Abschalten) überwältigt und treffen keine Entscheidungen, wodurch Systeme in der Schwebe bleiben.
    slug_de: laehmung-der-modernisierungsstrategie
  monitoring-gaps:
    title_de: Monitoring-Lücken
    description_de: Unzureichendes Produktions-Monitoring und mangelnde Observability erschweren es, Probleme zeitnah zu erkennen und zu diagnostizieren, was zu längeren Ausfällen und schwerwiegenderen Folgen führt.
    slug_de: monitoring-luecken
  monolithic-architecture-constraints:
    title_de: Einschränkungen durch monolithische Architektur
    description_de: Große monolithische Codebasen werden mit wachsender Größe und Komplexität schwer zu warten, zu skalieren und zu deployen.
    slug_de: einschraenkungen-durch-monolithische-architektur
  monolithic-functions-and-classes:
    title_de: Monolithische Funktionen und Klassen
    description_de: Einzelne Funktionen oder Klassen übernehmen zu viele unzusammenhängende Verantwortlichkeiten, was sie schwer verständlich und veränderbar macht.
    slug_de: monolithische-funktionen-und-klassen
  n-plus-one-query-problem:
    title_de: N+1-Abfrageproblem
    description_de: Eine Anwendung führt zahlreiche unnötige Datenbankaufrufe aus, um verwandte Daten abzurufen, wo eine einzelne, effizientere Abfrage ausreichen würde, was zu erheblicher Performance-Verschlechterung führt.
    slug_de: n-plus-1-abfrageproblem
  negative-brand-perception:
    title_de: Negative Markenwahrnehmung
    description_de: Nutzer verbinden die Marke aufgrund technischer Probleme mit schlechter Qualität oder Unzuverlässigkeit.
    slug_de: negative-markenwahrnehmung
  negative-user-feedback:
    title_de: Negatives Nutzerfeedback
    description_de: Nutzer beschweren sich über langsame Ladezeiten, Anwendungsabstürze oder andere Probleme, was auf Unzufriedenheit mit der Performance oder Nutzbarkeit der Anwendung hinweist.
    slug_de: negatives-nutzerfeedback
  network-latency:
    title_de: Netzwerklatenz
    description_de: Verzögerungen bei der Datenübertragung über das Netzwerk erhöhen die Antwortzeiten erheblich und beeinträchtigen die Anwendungsperformance.
    slug_de: netzwerklatenz
  new-hire-frustration:
    title_de: Frustration neuer Mitarbeiter
    description_de: Kürzlich eingestellte Entwickler erleben erhebliche Frustration aufgrund von Hindernissen, die sie daran hindern, effektiv zum Team beizutragen.
    slug_de: frustration-neuer-mitarbeiter
  nitpicking-culture:
    title_de: Nitpicking-Kultur
    description_de: Code-Reviews konzentrieren sich übermäßig auf kleine, unbedeutende Details, während wichtige Design- und Funktionalitätsprobleme übersehen werden.
    slug_de: nitpicking-kultur
  no-continuous-feedback-loop:
    title_de: Kein kontinuierlicher Feedback-Loop
    description_de: Stakeholder werden nicht durchgängig in den Entwicklungsprozess einbezogen, und Feedback wird nur ganz am Ende eingeholt, was zu fehlausgerichteten Liefergegenständen führt.
    slug_de: kein-kontinuierlicher-feedback-loop
  no-formal-change-control-process:
    title_de: Kein formaler Änderungskontrollprozess
    description_de: Änderungen am Projektumfang oder an den Anforderungen werden nicht formal bewertet oder genehmigt, was zu unkontrolliertem Scope Creep und Projektverzögerungen führt.
    slug_de: kein-formaler-aenderungskontrollprozess
  null-pointer-dereferences:
    title_de: Nullzeiger-Dereferenzierungen
    description_de: Programme versuchen, über Null- oder ungültige Zeiger auf Speicher zuzugreifen, was Abstürze und potenzielle Sicherheitslücken verursacht.
    slug_de: nullzeiger-dereferenzierungen
  obsolete-technologies:
    title_de: Veraltete Technologien
    description_de: Das System verlässt sich auf veraltete Werkzeuge, Frameworks oder Sprachen, die die Umsetzung moderner Entwicklungspraktiken erschweren.
    slug_de: veraltete-technologien
  operational-overhead:
    title_de: Operativer Overhead
    description_de: Ein erheblicher Teil an Zeit und Ressourcen wird für Notfallreaktionen und Feuerlöschen aufgewendet, statt für geplante Entwicklung und Innovation.
    slug_de: operativer-overhead
  organizational-structure-mismatch:
    title_de: Fehlpassung der Organisationsstruktur
    description_de: Eine Situation, in der die Struktur der Organisation nicht zur Architektur des Systems passt.
    slug_de: fehlpassung-der-organisationsstruktur
  outdated-tests:
    title_de: Veraltete Tests
    description_de: Tests werden nicht aktualisiert, wenn sich der Code ändert, was zu falsch-positiven oder falsch-negativen Ergebnissen und verringertem Vertrauen führt.
    slug_de: veraltete-tests
  over-reliance-on-utility-classes:
    title_de: Übermäßige Abhängigkeit von Utility-Klassen
    description_de: Der übermäßige Einsatz von Utility-Klassen mit statischen Methoden kann zu einem prozeduralen Programmierstil und fehlendem objektorientiertem Design führen.
    slug_de: uebermaessige-abhaengigkeit-von-utility-klassen
  overworked-teams:
    title_de: Überlastete Teams
    description_de: Hohe Arbeitsbelastung führt zu Burnout, Fehlern und langfristigen Einbußen bei Qualität und Produktivität.
    slug_de: ueberlastete-teams
  partial-bug-fixes:
    title_de: Teilweise Fehlerbehebungen
    description_de: Probleme scheinen gelöst zu sein, tauchen aber in anderen Kontexten wieder auf, weil der Fix nicht auf alle Instanzen des duplizierten Codes angewendet wurde.
    slug_de: teilweise-fehlerbehebungen
  password-security-weaknesses:
    title_de: Schwachstellen bei der Passwortsicherheit
    description_de: Schwache Passwortrichtlinien, unzureichende Speichermechanismen und schlechte Authentifizierungspraktiken erzeugen Sicherheitslücken.
    slug_de: schwachstellen-bei-der-passwortsicherheit
  past-negative-experiences:
    title_de: Negative Erfahrungen aus der Vergangenheit
    description_de: Eine Situation, in der Entwickler zögern, Änderungen an der Codebasis vorzunehmen, aufgrund negativer Erfahrungen in der Vergangenheit.
    slug_de: negative-erfahrungen-aus-der-vergangenheit
  perfectionist-culture:
    title_de: Perfektionismus-Kultur
    description_de: Eine Kultur des Perfektionismus und die Zurückhaltung, irgendetwas zu veröffentlichen, das nicht zu 100% perfekt ist, kann zu Analyse-Lähmung und langen Release-Zyklen führen.
    slug_de: perfektionismus-kultur
  perfectionist-review-culture:
    title_de: Perfektionistische Review-Kultur
    description_de: Die Teamkultur legt Wert darauf, Code durch Reviews perfekt zu machen, statt sich auf sinnvolle Verbesserungen zu konzentrieren, was zu übermäßigen Überarbeitungszyklen führt.
    slug_de: perfektionistische-review-kultur
  planning-credibility-issues:
    title_de: Probleme mit der Glaubwürdigkeit der Planung
    description_de: Künftige Schätzungen und Pläne werden aufgrund einer Historie ungenauer Vorhersagen und verpasster Zusagen infrage gestellt oder ignoriert.
    slug_de: probleme-mit-der-glaubwuerdigkeit-der-planung
  planning-dysfunction:
    title_de: Planungsdysfunktion
    description_de: Projektplanungsprozesse schaffen es nicht, realistische Zeitpläne zu erstellen, Ressourcen effektiv zuzuweisen oder Projektkomplexitäten und -risiken zu berücksichtigen.
    slug_de: planungsdysfunktion
  poor-caching-strategy:
    title_de: Schlechte Caching-Strategie
    description_de: Daten, die zwischengespeichert werden könnten, werden bei jeder Anfrage von der Quelle abgerufen, was unnötigen Overhead hinzufügt und die Latenz erhöht.
    slug_de: schlechte-caching-strategie
  poor-communication:
    title_de: Schlechte Kommunikation
    description_de: Die Zusammenarbeit bricht zusammen, da Entwickler isolierter werden und weniger bereit sind, sich mit Kollegen auszutauschen.
    slug_de: schlechte-kommunikation
  poor-contract-design:
    title_de: Schlechtes Vertragsdesign
    description_de: Rechtliche Vereinbarungen und Verträge spiegeln nicht die Projektrealitäten, technischen Anforderungen wider oder erlauben nicht die während der Entwicklung nötige Flexibilität.
    slug_de: schlechtes-vertragsdesign
  poor-documentation:
    title_de: Schlechte Dokumentation
    description_de: Systemdokumentation ist veraltet, unvollständig, ungenau oder schwer auffindbar und effektiv nutzbar.
    slug_de: schlechte-dokumentation
  poor-domain-model:
    title_de: Schlechtes Domänenmodell
    description_de: Zentrale Geschäftskonzepte werden im System schlecht verstanden oder abgebildet, was zu brüchiger Logik und Missverständnissen führt.
    slug_de: schlechtes-domaenenmodell
  poor-encapsulation:
    title_de: Schlechte Kapselung
    description_de: Daten und das auf ihnen operierende Verhalten sind nicht in einer einzigen, kohäsiven Einheit gebündelt, was zu fehlendem Data Hiding und hoher Kopplung führt.
    slug_de: schlechte-kapselung
  poor-interfaces-between-applications:
    title_de: Schlechte Schnittstellen zwischen Anwendungen
    description_de: Getrennte oder schlecht definierte Schnittstellen führen zu brüchigen Integrationen und inkonsistenten Daten.
    slug_de: schlechte-schnittstellen-zwischen-anwendungen
  poor-naming-conventions:
    title_de: Schlechte Namenskonventionen
    description_de: Variablen, Funktionen, Klassen und andere Codeelemente werden so benannt, dass sie ihren Zweck oder ihre Bedeutung nicht klar vermitteln.
    slug_de: schlechte-namenskonventionen
  poor-operational-concept:
    title_de: Schlechtes Betriebskonzept
    description_de: Fehlende Planung für Monitoring, Wartung oder Support führt zu Instabilität nach dem Launch.
    slug_de: schlechtes-betriebskonzept
  poor-planning:
    title_de: Schlechte Planung
    description_de: Teams haben keine klaren Pläne oder realistischen Schätzungen des Arbeitsaufwands, was zu Projektverzögerungen und Problemen bei der Ressourcenzuweisung führt.
    slug_de: schlechte-planung
  poor-project-control:
    title_de: Schlechte Projektsteuerung
    description_de: Der Projektfortschritt wird nicht wirksam überwacht, sodass Probleme unbemerkt bleiben, bis eine Behebung schwierig oder unmöglich wird.
    slug_de: schlechte-projektsteuerung
  poor-system-environment:
    title_de: Schlechte Systemumgebung
    description_de: Das System wird in einer instabilen, falsch konfigurierten oder ungeeigneten Umgebung betrieben, die Ausfälle, Performance-Probleme und operative Schwierigkeiten verursacht.
    slug_de: schlechte-systemumgebung
  poor-teamwork:
    title_de: Schlechte Teamarbeit
    description_de: Teammitglieder arbeiten isoliert, widersetzen sich Zusammenarbeit oder es fehlt an gegenseitigem Respekt, was die Gesamteffektivität verringert.
    slug_de: schlechte-teamarbeit
  poor-test-coverage:
    title_de: Schlechte Testabdeckung
    description_de: Kritische Teile der Codebasis werden nicht durch Tests abgedeckt, was blinde Flecken in der Qualitätssicherung erzeugt.
    slug_de: schlechte-testabdeckung
  poor-user-experience-ux-design:
    title_de: Schlechtes Nutzererlebnis (UX-Design)
    description_de: Die Anwendung ist schwer zu bedienen, verwirrend oder erfüllt die Nutzerbedürfnisse nicht.
    slug_de: schlechtes-nutzererlebnis-ux-design
  poorly-defined-responsibilities:
    title_de: Schlecht definierte Verantwortlichkeiten
    description_de: Module oder Klassen sind nicht mit einer einzigen, klaren Verantwortlichkeit gestaltet, was zu Verwirrung und enger Kopplung führt.
    slug_de: schlecht-definierte-verantwortlichkeiten
  power-struggles:
    title_de: Machtkämpfe
    description_de: Interne Konflikte zwischen Abteilungen oder Führungskräften stören Entscheidungsfindung und Projektfortschritt.
    slug_de: machtkaempfe
  premature-technology-introduction:
    title_de: Verfrühte Technologieeinführung
    description_de: Neue Frameworks, Werkzeuge oder Plattformen werden ohne angemessene Bewertung eingeführt, was Risiko und Lernaufwand zu Projekten hinzufügt.
    slug_de: verfruehte-technologieeinfuehrung
  priority-thrashing:
    title_de: Prioritäten-Thrashing
    description_de: Arbeitsprioritäten ändern sich häufig und unerwartet, was ständigen Aufgabenwechsel verursacht und den geplanten Arbeitsfluss stört.
    slug_de: prioritaeten-thrashing
  procedural-background:
    title_de: Prozeduraler Hintergrund
    description_de: Entwickler mit einem Hintergrund in prozeduraler Programmierung tun sich möglicherweise schwer, sich an eine objektorientierte Denkweise anzupassen, was zu prozeduralem Code in einer objektorientierten Sprache führt.
    slug_de: prozeduraler-hintergrund
  procedural-programming-in-oop-languages:
    title_de: Prozedurale Programmierung in OOP-Sprachen
    description_de: Code wird in einem prozeduralen Stil innerhalb objektorientierter Sprachen geschrieben, was zu großen, monolithischen Funktionen und schlechter Kapselung führt.
    slug_de: prozedurale-programmierung-in-oop-sprachen
  process-design-flaws:
    title_de: Fehler im Prozessdesign
    description_de: Entwicklungsprozesse sind schlecht gestaltet, was Ineffizienzen, Engpässe und Hindernisse für produktive Arbeit erzeugt.
    slug_de: fehler-im-prozessdesign
  process-software-misfit:
    title_de: Fehlpassung zwischen Prozess und Software
    description_de: Die Software wurde so verbogen, dass sie zu einem historisch gewachsenen Prozess passt, statt den Prozess gegen das zu prüfen, was das Produkt voraussetzt.
    slug_de: fehlpassung-zwischen-prozess-und-software
  procrastination-on-complex-tasks:
    title_de: Prokrastination bei komplexen Aufgaben
    description_de: Schwierige oder kognitiv anspruchsvolle Arbeit wird durchgängig zugunsten einfacherer, unmittelbar befriedigenderer Aufgaben aufgeschoben.
    slug_de: prokrastination-bei-komplexen-aufgaben
  product-direction-chaos:
    title_de: Chaos in der Produktrichtung
    description_de: Mehrere Stakeholder liefern widersprüchliche Prioritäten ohne klare Produktführung, was Teamverwirrung und verschwendeten Aufwand verursacht.
    slug_de: chaos-in-der-produktrichtung
  project-authority-vacuum:
    title_de: Vakuum an Projektautorität
    description_de: Kritischen Projekten fehlt ausreichende organisatorische Unterstützung und Sponsoring durch die Führungsebene, um Widerstand zu überwinden und Ressourcen zu sichern.
    slug_de: vakuum-an-projektautoritaet
  project-resource-constraints:
    title_de: Projekt-Ressourcenbeschränkungen
    description_de: Projekte können aufgrund schlechter Planung oder konkurrierender Prioritäten nicht das nötige Budget, Personal oder organisatorische Ressourcen erhalten.
    slug_de: projekt-ressourcenbeschraenkungen
  quality-blind-spots:
    title_de: Qualitäts-blinde Flecken
    description_de: Kritisches Systemverhalten und Fehlermodi bleiben aufgrund von Lücken in Testabdeckung und Verifikationspraktiken unentdeckt.
    slug_de: qualitaets-blinde-flecken
  quality-compromises:
    title_de: Qualitätskompromisse
    description_de: Qualitätsstandards werden bewusst gesenkt oder Abkürzungen genommen, um Termine, Budgets oder andere Einschränkungen einzuhalten, was langfristige Probleme erzeugt.
    slug_de: qualitaetskompromisse
  quality-degradation:
    title_de: Qualitätsverschlechterung
    description_de: Die Systemqualität nimmt im Laufe der Zeit ab, aufgrund angehäufter technischer Schulden, Abkürzungen und unzureichender Qualitätspraktiken.
    slug_de: qualitaetsverschlechterung
  queries-that-prevent-index-usage:
    title_de: Abfragen, die die Indexnutzung verhindern
    description_de: Die Art, wie eine Abfrage geschrieben ist, kann die Datenbank daran hindern, einen verfügbaren Index zu nutzen, was langsamere Full-Table-Scans oder weniger effiziente Index-Scans erzwingt.
    slug_de: abfragen-die-die-indexnutzung-verhindern
  race-conditions:
    title_de: Race Conditions
    description_de: Mehrere Threads greifen gleichzeitig ohne angemessene Synchronisation auf gemeinsame Ressourcen zu, was zu unvorhersehbarem Verhalten und Datenkorruption führt.
    slug_de: race-conditions
  rapid-prototyping-becoming-production:
    title_de: Rapid Prototyping wird zu Produktion
    description_de: Schnell für Prototypen oder Proof-of-Concepts geschriebener Code landet ohne angemessene Engineering-Praktiken in Produktivsystemen.
    slug_de: rapid-prototyping-wird-zu-produktion
  rapid-system-changes:
    title_de: Schnelle Systemänderungen
    description_de: Häufige Änderungen an Systemarchitektur, APIs oder Kernfunktionalität überholen Dokumentation und Teamverständnis.
    slug_de: schnelle-systemaenderungen
  rapid-team-growth:
    title_de: Schnelles Teamwachstum
    description_de: Teams wachsen schnell an Größe, ohne angemessene Vorbereitung, was bestehende Infrastruktur und Unterstützungssysteme überfordert.
    slug_de: schnelles-teamwachstum
  rate-limiting-issues:
    title_de: Probleme mit Rate Limiting
    description_de: Rate-Limiting-Mechanismen sind falsch konfiguriert, zu restriktiv oder unwirksam, was legitime Anfragen blockiert oder Missbrauch nicht verhindert.
    slug_de: probleme-mit-rate-limiting
  reduced-code-submission-frequency:
    title_de: Verringerte Häufigkeit von Code-Einreichungen
    description_de: Entwickler bündeln mehrere Änderungen oder verzögern Einreichungen, um häufige Code-Review-Zyklen zu vermeiden, was Feedback-Qualität und Integrationshäufigkeit verringert.
    slug_de: verringerte-haeufigkeit-von-code-einreichungen
  reduced-feature-quality:
    title_de: Verringerte Feature-Qualität
    description_de: Weniger Zeit steht für den Feinschliff gelieferter Features zur Verfügung, was zu Nutzererlebnissen und Funktionalität geringerer Qualität führt.
    slug_de: verringerte-feature-qualitaet
  reduced-individual-productivity:
    title_de: Verringerte individuelle Produktivität
    description_de: Einzelne Entwickler erledigen weniger Aufgaben und brauchen länger, um Probleme zu lösen, trotz gleichbleibendem Arbeitseinsatz.
    slug_de: verringerte-individuelle-produktivitaet
  reduced-innovation:
    title_de: Verringerte Innovation
    description_de: Teams werden neuen Ideen gegenüber ablehnend und konzentrieren sich nur auf das Nötigste, um durchzukommen.
    slug_de: verringerte-innovation
  reduced-predictability:
    title_de: Verringerte Vorhersagbarkeit
    description_de: Entwicklungszeitpläne, Ergebnisse und Systemverhalten werden schwer genau vorhersagbar, was Planung und Erwartungsmanagement erschwert.
    slug_de: verringerte-vorhersagbarkeit
  reduced-review-participation:
    title_de: Verringerte Review-Beteiligung
    description_de: Viele Teammitglieder vermeiden die Teilnahme an Code-Reviews, was die Review-Last auf wenige Personen konzentriert und die Abdeckung verringert.
    slug_de: verringerte-review-beteiligung
  reduced-team-flexibility:
    title_de: Verringerte Teamflexibilität
    description_de: Die Fähigkeit des Teams, sich an ändernde Anforderungen anzupassen, Arbeit neu zuzuweisen oder auf unerwartete Herausforderungen zu reagieren, ist erheblich eingeschränkt.
    slug_de: verringerte-teamflexibilitaet
  reduced-team-productivity:
    title_de: Verringerte Teamproduktivität
    description_de: Die Gesamtleistung und Effektivität des Entwicklungsteams sinkt aufgrund verschiedener systemischer Probleme und Ineffizienzen.
    slug_de: verringerte-teamproduktivitaet
  refactoring-avoidance:
    title_de: Refactoring-Vermeidung
    description_de: Das Entwicklungsteam vermeidet aktiv das Refactoring der Codebasis, selbst wenn es dessen Notwendigkeit anerkennt, aus Angst, neue Fehler einzuführen.
    slug_de: refactoring-vermeidung
  regression-bugs:
    title_de: Regressionsfehler
    description_de: Neue Funktionen oder Fixes brechen unbeabsichtigt bestehende Funktionalität, die zuvor korrekt funktionierte.
    slug_de: regressionsfehler
  regulatory-compliance-drift:
    title_de: Regulatorische Compliance-Drift
    description_de: Legacy-Systeme hinken sich entwickelnden regulatorischen Anforderungen hinterher, was Compliance-Lücken erzeugt, die teuer und riskant zu schließen sind.
    slug_de: regulatorische-compliance-drift
  reimplemented-standard-functionality:
    title_de: Neu implementierte Standardfunktionalität
    description_de: Eine Fähigkeit, die das Produkt bereits bietet, wurde erneut als individuelle Entwicklung gebaut, was Wartungsaufwand hinzufügt und den Nutzen des Produktkaufs zunichtemacht.
    slug_de: neu-implementierte-standardfunktionalitaet
  release-anxiety:
    title_de: Release-Angst
    description_de: Das Entwicklungsteam ist wegen des hohen Fehlschlagsrisikos und des Drucks, es richtig zu machen, ängstlich und gestresst bezüglich Deployments.
    slug_de: release-angst
  release-instability:
    title_de: Release-Instabilität
    description_de: Produktions-Releases sind häufig instabil, was Störungen für Nutzer verursacht und sofortige Aufmerksamkeit des Entwicklungsteams erfordert.
    slug_de: release-instabilitaet
  requirements-ambiguity:
    title_de: Anforderungsmehrdeutigkeit
    description_de: Systemanforderungen sind unklar, unvollständig oder für mehrere Interpretationen offen, was zu fehlausgerichteten Implementierungen und Nacharbeit führt.
    slug_de: anforderungsmehrdeutigkeit
  resistance-to-change:
    title_de: Widerstand gegen Veränderung
    description_de: Teams zögern, Teile des Systems zu refaktorisieren oder zu verbessern, aufgrund wahrgenommenen Risikos und Aufwands, was zu Stagnation führt.
    slug_de: widerstand-gegen-veraenderung
  resource-allocation-failures:
    title_de: Fehler bei der Ressourcenzuweisung
    description_de: Objekte, Verbindungen, Datei-Handles oder andere Systemressourcen werden zugewiesen, aber nie ordentlich freigegeben oder geschlossen, was zu Ressourcenerschöpfung führt.
    slug_de: fehler-bei-der-ressourcenzuweisung
  resource-contention:
    title_de: Ressourcenkonkurrenz
    description_de: Der Server ist überlastet, und die Anwendung konkurriert um begrenzte Ressourcen wie CPU, Speicher oder I/O.
    slug_de: ressourcenkonkurrenz
  resource-waste:
    title_de: Ressourcenverschwendung
    description_de: Verfügbare Ressourcen werden nicht effektiv genutzt, was zu Unterauslastung führt, während andere Bereiche eingeschränkt oder überlastet bleiben.
    slug_de: ressourcenverschwendung
  rest-api-design-issues:
    title_de: Probleme im REST-API-Design
    description_de: Schlechtes REST-API-Design verletzt REST-Prinzipien, erzeugt Nutzbarkeitsprobleme und führt zu ineffizienten Client-Server-Interaktionen.
    slug_de: probleme-im-rest-api-design
  retention-obligations-block-change:
    title_de: Aufbewahrungspflichten blockieren Änderungen
    description_de: Gesetzliche Aufbewahrungspflichten hängen an Daten, deren Format und System niemand ändern kann, sodass die Pflicht das System einfriert, das sie enthält.
    slug_de: aufbewahrungspflichten-blockieren-aenderungen
  review-bottlenecks:
    title_de: Review-Engpässe
    description_de: Der Code-Review-Prozess wird zu einem erheblichen Engpass, was die Auslieferung neuer Funktionen und Fehlerbehebungen verzögert.
    slug_de: review-engpaesse
  review-process-avoidance:
    title_de: Vermeidung des Review-Prozesses
    description_de: Teammitglieder suchen aktiv nach Wegen, Code-Review-Anforderungen zu umgehen oder zu minimieren, was den Qualitätssicherungsprozess untergräbt.
    slug_de: vermeidung-des-review-prozesses
  review-process-breakdown:
    title_de: Zusammenbruch des Review-Prozesses
    description_de: Code-Review-Praktiken schaffen es aufgrund systemischer Prozessfehler nicht, kritische Probleme zu identifizieren, aussagekräftiges Feedback zu geben oder die Codequalität zu verbessern.
    slug_de: zusammenbruch-des-review-prozesses
  reviewer-anxiety:
    title_de: Reviewer-Angst
    description_de: Teammitglieder fühlen sich unsicher und ängstlich bei der Durchführung von Code-Reviews, was zu Vermeidung oder oberflächlichen Review-Praktiken führt.
    slug_de: reviewer-angst
  reviewer-inexperience:
    title_de: Unerfahrenheit der Reviewer
    description_de: Reviewern fehlt die Erfahrung, um tiefere Probleme zu identifizieren, sodass sie sich auf das konzentrieren, was sie verstehen.
    slug_de: unerfahrenheit-der-reviewer
  ripple-effect-of-changes:
    title_de: Wellenwirkung von Änderungen
    description_de: Eine kleine Änderung in einem Teil des Systems erfordert Anpassungen in vielen anderen, scheinbar unabhängigen Teilen, was auf hohe Kopplung hinweist.
    slug_de: wellenwirkung-von-aenderungen
  rushed-approvals:
    title_de: Übereilte Genehmigungen
    description_de: Pull Requests werden aufgrund von Zeitdruck oder Prozessproblemen schnell genehmigt, ohne gründliche Prüfung.
    slug_de: uebereilte-genehmigungen
  scaling-inefficiencies:
    title_de: Ineffizienzen bei der Skalierung
    description_de: Eine Situation, in der es schwierig oder unmöglich ist, verschiedene Teile eines Systems unabhängig voneinander zu skalieren.
    slug_de: ineffizienzen-bei-der-skalierung
  schema-evolution-paralysis:
    title_de: Lähmung der Schema-Evolution
    description_de: Das Datenbankschema kann aufgrund umfangreicher Abhängigkeiten und fehlendem Migrations-Tooling nicht geändert werden, um neue Anforderungen zu unterstützen.
    slug_de: laehmung-der-schema-evolution
  scope-change-resistance:
    title_de: Widerstand gegen Scope-Änderungen
    description_de: Notwendige Änderungen am Projektumfang werden aufgrund von Prozesseinschränkungen, Vertragsbeschränkungen oder organisatorischer Trägheit vermieden oder abgelehnt.
    slug_de: widerstand-gegen-scope-aenderungen
  scope-creep:
    title_de: Scope Creep
    description_de: Projektanforderungen wachsen kontinuierlich ohne angemessene Kontrolle oder Auswirkungsanalyse, was Zeitpläne, Budgets und die ursprünglichen Ziele gefährdet.
    slug_de: scope-creep
  second-system-effect:
    title_de: Zweitsystem-Effekt
    description_de: Lehren aus einem alten System führen zu Überkompensation, was aufgeblähte oder übermäßig ambitionierte Designs schafft.
    slug_de: zweitsystem-effekt
  secret-management-problems:
    title_de: Probleme beim Secret Management
    description_de: Unzureichender Umgang mit sensiblen Zugangsdaten und Secrets erzeugt Sicherheitslücken und operative Herausforderungen.
    slug_de: probleme-beim-secret-management
  serialization-deserialization-bottlenecks:
    title_de: Engpässe bei Serialisierung/Deserialisierung
    description_de: Ineffiziente Serialisierung und Deserialisierung von Daten erzeugt Performance-Engpässe bei API-Kommunikation und Datenpersistenzoperationen.
    slug_de: engpaesse-bei-serialisierung-deserialisierung
  service-discovery-failures:
    title_de: Fehler bei der Service Discovery
    description_de: Service-Discovery-Mechanismen scheitern daran, Services zu finden oder zu verbinden, was Kommunikationsausfälle und Systeminstabilität in verteilten Architekturen verursacht.
    slug_de: fehler-bei-der-service-discovery
  service-timeouts:
    title_de: Service-Timeouts
    description_de: Services schaffen es nicht, Anfragen innerhalb eines akzeptablen Zeitlimits abzuschließen, was Fehler, Kaskadenausfälle und Systeminstabilität verursacht.
    slug_de: service-timeouts
  session-management-issues:
    title_de: Probleme im Session-Management
    description_de: Schlechte Session-Verwaltung erzeugt Sicherheitslücken durch Session Hijacking, Fixation oder unsachgemäßes Lifecycle-Management.
    slug_de: probleme-im-session-management
  shadow-systems:
    title_de: Schattensysteme
    description_de: Alternative Lösungen, die außerhalb offizieller Kanäle entwickelt werden, untergraben Standardisierung und schaffen versteckte Abhängigkeiten.
    slug_de: schattensysteme
  shared-database:
    title_de: Gemeinsam genutzte Datenbank
    description_de: Eine Situation, in der mehrere Services oder Komponenten eine einzige Datenbank gemeinsam nutzen.
    slug_de: gemeinsam-genutzte-datenbank
  shared-dependencies:
    title_de: Gemeinsam genutzte Abhängigkeiten
    description_de: Eine Situation, in der mehrere Komponenten oder Services einen gemeinsamen Satz von Bibliotheken und Frameworks teilen.
    slug_de: gemeinsam-genutzte-abhaengigkeiten
  short-term-focus:
    title_de: Kurzfristiger Fokus
    description_de: Das Management priorisiert die unmittelbare Auslieferung von Features gegenüber langfristiger Code-Gesundheit und architektonischen Verbesserungen, was Nachhaltigkeitsprobleme schafft.
    slug_de: kurzfristiger-fokus
  silent-data-corruption:
    title_de: Stille Datenkorruption
    description_de: Daten werden korrumpiert, ohne Fehler oder Warnungen auszulösen, was zu falschen Ergebnissen und Verlust der Datenintegrität führt.
    slug_de: stille-datenkorruption
  single-entry-point-design:
    title_de: Design mit einzigem Einstiegspunkt
    description_de: Ein Design, bei dem alle Anfragen an ein System durch ein einziges Objekt oder eine einzige Komponente gehen müssen.
    slug_de: design-mit-einzigem-einstiegspunkt
  single-points-of-failure:
    title_de: Single Points of Failure
    description_de: Fortschritt wird blockiert, wenn bestimmte Wissensträger oder Systemkomponenten nicht verfügbar sind, was kritische Abhängigkeiten schafft.
    slug_de: single-points-of-failure
  skill-development-gaps:
    title_de: Lücken in der Kompetenzentwicklung
    description_de: Teammitglieder entwickeln aufgrund von Vermeidung, Spezialisierung oder unzureichenden Lernmöglichkeiten keine Expertise in wichtigen Technologien oder Domänen.
    slug_de: luecken-in-der-kompetenzentwicklung
  slow-application-performance:
    title_de: Langsame Anwendungsperformance
    description_de: Nutzerseitige Funktionen, die auf der API basieren, fühlen sich träge oder unresponsiv an.
    slug_de: langsame-anwendungsperformance
  slow-database-queries:
    title_de: Langsame Datenbankabfragen
    description_de: Die Anwendungsperformance verschlechtert sich aufgrund ineffizienten Datenabrufs aus der Datenbank.
    slug_de: langsame-datenbankabfragen
  slow-development-velocity:
    title_de: Langsame Entwicklungsgeschwindigkeit
    description_de: Das Team schafft es durchgängig nicht, Features und Fehlerbehebungen in einem vorhersehbaren und akzeptablen Tempo zu liefern, wobei die Gesamtproduktivität systematisch sinkt.
    slug_de: langsame-entwicklungsgeschwindigkeit
  slow-feature-development:
    title_de: Langsame Feature-Entwicklung
    description_de: Das Tempo der Entwicklung und Auslieferung neuer Features ist durchgängig langsam, oft aufgrund der Komplexität und Brüchigkeit der bestehenden Codebasis.
    slug_de: langsame-feature-entwicklung
  slow-incident-resolution:
    title_de: Langsame Vorfallslösung
    description_de: Probleme und Ausfälle benötigen übermäßig viel Zeit zur Diagnose und Lösung, was die Geschäftsauswirkung und Nutzerfrustration verlängert.
    slug_de: langsame-vorfallsloesung
  slow-knowledge-transfer:
    title_de: Langsamer Wissenstransfer
    description_de: Eine Situation, in der neue Teammitglieder lange brauchen, um produktiv zu werden.
    slug_de: langsamer-wissenstransfer
  slow-response-times-for-lists:
    title_de: Langsame Antwortzeiten für Listen
    description_de: Webseiten oder API-Endpunkte, die Listen von Elementen anzeigen, laden deutlich langsamer als solche, die einzelne Elemente anzeigen, oft aufgrund ineffizienten Datenabrufs.
    slug_de: langsame-antwortzeiten-fuer-listen
  spaghetti-code:
    title_de: Spaghetticode
    description_de: Code mit verworrener, unstrukturierter Logik, der nahezu unmöglich sicher zu verstehen, zu debuggen oder zu ändern ist.
    slug_de: spaghetticode
  sql-injection-vulnerabilities:
    title_de: SQL-Injection-Schwachstellen
    description_de: Unzureichende Eingabebereinigung erlaubt Angreifern, bösartigen SQL-Code einzuschleusen, was Datenbanksicherheit und Datenintegrität kompromittieren kann.
    slug_de: sql-injection-schwachstellen
  stack-overflow-errors:
    title_de: Stack-Overflow-Fehler
    description_de: Programme überschreiten den zugewiesenen Stack-Speicher aufgrund übermäßiger Rekursion oder großer lokaler Variablen, was Anwendungsabstürze verursacht.
    slug_de: stack-overflow-fehler
  staff-availability-issues:
    title_de: Probleme mit der Personalverfügbarkeit
    description_de: Benötigte Rollen bleiben unbesetzt oder Mitarbeiter sind überbucht, was die Umsetzungskapazität und den Projektfortschritt verringert.
    slug_de: probleme-mit-der-personalverfuegbarkeit
  stagnant-architecture:
    title_de: Stagnierende Architektur
    description_de: Die Systemarchitektur entwickelt sich nicht weiter, um sich ändernden Geschäftsanforderungen gerecht zu werden, weil größeres Refactoring durchgängig vermieden wird.
    slug_de: stagnierende-architektur
  stakeholder-confidence-loss:
    title_de: Vertrauensverlust bei Stakeholdern
    description_de: Geschäftspartner verlieren das Vertrauen in die Fähigkeit des Entwicklungsteams, Zusagen einzuhalten, was Spannungen erzeugt und die Zusammenarbeit verringert.
    slug_de: vertrauensverlust-bei-stakeholdern
  stakeholder-developer-communication-gap:
    title_de: Kommunikationslücke zwischen Stakeholdern und Entwicklern
    description_de: Ein anhaltendes Missverständnis zwischen dem, was Stakeholder erwarten, und dem, was das Entwicklungsteam baut, was zu Nacharbeit und Unzufriedenheit führt.
    slug_de: kommunikationsluecke-zwischen-stakeholdern-und-entwicklern
  stakeholder-dissatisfaction:
    title_de: Unzufriedenheit der Stakeholder
    description_de: Geschäftliche Stakeholder werden unzufrieden mit Projektergebnissen, Entwicklungsgeschwindigkeit oder Kommunikationsqualität.
    slug_de: unzufriedenheit-der-stakeholder
  stakeholder-frustration:
    title_de: Frustration der Stakeholder
    description_de: Geschäftliche Stakeholder werden frustriert über Entwicklungsfortschritt, Qualität oder Kommunikation, was zu angespannten Beziehungen und verringerter Unterstützung führt.
    slug_de: frustration-der-stakeholder
  strangler-fig-pattern-failures:
    title_de: Fehlschläge des Strangler-Fig-Patterns
    description_de: Die schrittweise Modernisierung mittels Strangler-Fig-Pattern stockt aufgrund komplexer Abhängigkeiten und Herausforderungen bei der Datenkonsistenz.
    slug_de: fehlschlaege-des-strangler-fig-patterns
  style-arguments-in-code-reviews:
    title_de: Stildiskussionen in Code-Reviews
    description_de: Eine Situation, in der ein erheblicher Teil der Zeit in Code-Reviews damit verbracht wird, über triviale Stilfragen zu diskutieren, statt sich auf Logik und Design zu konzentrieren.
    slug_de: stildiskussionen-in-code-reviews
  suboptimal-solutions:
    title_de: Suboptimale Lösungen
    description_de: Gelieferte Lösungen funktionieren, sind aber ineffizient, schwer zu bedienen oder adressieren die zugrunde liegenden Probleme, die sie lösen sollten, nicht vollständig.
    slug_de: suboptimale-loesungen
  superficial-code-reviews:
    title_de: Oberflächliche Code-Reviews
    description_de: Code-Reviews konzentrieren sich nur auf oberflächliche Probleme wie Formatierung und Stil, während wichtige Design-, Logik- oder Sicherheitsprobleme übersehen werden.
    slug_de: oberflaechliche-code-reviews
  synchronization-problems:
    title_de: Synchronisationsprobleme
    description_de: Aktualisierungen an einer Kopie duplizierter Logik werden nicht auf andere Kopien angewendet, was zu divergierendem Verhalten im System führt.
    slug_de: synchronisationsprobleme
  system-integration-blindness:
    title_de: Blindheit bei der Systemintegration
    description_de: Komponenten funktionieren isoliert korrekt, scheitern aber bei der Integration, was Lücken im End-to-End-Systemverständnis offenbart.
    slug_de: blindheit-bei-der-systemintegration
  system-outages:
    title_de: Systemausfälle
    description_de: Serviceunterbrechungen und Systemausfälle treten häufig auf, was Geschäftsstörungen und Nutzerfrustration verursacht.
    slug_de: systemausfaelle
  system-stagnation:
    title_de: Systemstagnation
    description_de: Softwaresysteme bleiben über längere Zeiträume unverändert und entwickeln sich nicht weiter, um neuen Anforderungen, Technologien oder Geschäftsbedürfnissen gerecht zu werden.
    slug_de: systemstagnation
  tacit-knowledge:
    title_de: Implizites Erfahrungswissen
    description_de: Wissen, das sich nur schwer an eine andere Person weitergeben lässt, indem man es aufschreibt oder verbalisiert.
    slug_de: implizites-erfahrungswissen
  tangled-cross-cutting-concerns:
    title_de: Verworrene Querschnittsbelange
    description_de: Eine Situation, in der Querschnittsbelange wie Logging, Sicherheit und Transaktionen eng mit der Geschäftslogik verwoben sind.
    slug_de: verworrene-querschnittsbelange
  task-queues-backing-up:
    title_de: Aufstauende Task-Queues
    description_de: Asynchrone Jobs oder Nachrichten brauchen länger zur Verarbeitung, was Warteschlangen wachsen lässt und kritische Operationen verzögert.
    slug_de: aufstauende-task-queues
  team-churn-impact:
    title_de: Auswirkung von Team-Fluktuation
    description_de: Im Laufe der Zeit, wenn Entwickler dem Team beitreten und es verlassen, bringen sie inkonsistente Praktiken und Wissenslücken mit, die die Codequalität verschlechtern.
    slug_de: auswirkung-von-team-fluktuation
  team-confusion:
    title_de: Teamverwirrung
    description_de: Teammitgliedern ist unklar, was Projektziele, Prioritäten, Verantwortlichkeiten oder Prozesse angeht, was zu fehlausgerichteten Bemühungen und verschwendeter Arbeit führt.
    slug_de: teamverwirrung
  team-coordination-issues:
    title_de: Probleme bei der Teamkoordination
    description_de: Eine Situation, in der mehrere Entwickler oder Teams Schwierigkeiten haben, an derselben Codebasis zusammenzuarbeiten.
    slug_de: probleme-bei-der-teamkoordination
  team-demoralization:
    title_de: Demoralisierung des Teams
    description_de: Teammitglieder verlieren Motivation, Vertrauen und Begeisterung für ihre Arbeit aufgrund anhaltender Probleme oder organisatorischer Schwierigkeiten.
    slug_de: demoralisierung-des-teams
  team-dysfunction:
    title_de: Team-Dysfunktion
    description_de: Teammitglieder können aufgrund widersprüchlicher Ziele, zwischenmenschlicher Probleme oder struktureller Schwierigkeiten, die koordinierte Anstrengung verhindern, nicht effektiv zusammenarbeiten.
    slug_de: team-dysfunktion
  team-members-not-engaged-in-review-process:
    title_de: Teammitglieder nicht in den Review-Prozess eingebunden
    description_de: Code-Reviews werden oft denselben Personen zugewiesen, oder Reviewer geben kein aussagekräftiges Feedback, was zu einem Engpass und verringerter Qualität führt.
    slug_de: teammitglieder-nicht-in-den-review-prozess-eingebunden
  team-silos:
    title_de: Team-Silos
    description_de: Entwicklungsteams oder einzelne Entwickler arbeiten isoliert, was zu doppeltem Aufwand, inkonsistenten Lösungen und mangelndem Wissensaustausch führt.
    slug_de: team-silos
  technical-architecture-limitations:
    title_de: Einschränkungen der technischen Architektur
    description_de: Das Design der Systemarchitektur schafft Einschränkungen, die Performance, Skalierbarkeit, Wartbarkeit oder Entwicklungsgeschwindigkeit begrenzen.
    slug_de: einschraenkungen-der-technischen-architektur
  technology-isolation:
    title_de: Technologie-Isolation
    description_de: Das System wird zunehmend von modernen Technologie-Stacks isoliert, was die Fähigkeit einschränkt, Talente anzuziehen und neue Fähigkeiten zu nutzen.
    slug_de: technologie-isolation
  technology-lock-in:
    title_de: Technologie-Lock-in
    description_de: Eine Situation, in der es schwierig oder unmöglich ist, aufgrund der hohen Kosten oder des Aufwands zu einer neuen Technologie zu wechseln.
    slug_de: technologie-lock-in
  technology-stack-fragmentation:
    title_de: Fragmentierung des Technologie-Stacks
    description_de: Legacy-Systeme schaffen isolierte Technologie-Inseln, die Standardisierung verhindern und die operative Komplexität in der gesamten Organisation erhöhen.
    slug_de: fragmentierung-des-technologie-stacks
  test-debt:
    title_de: Testschulden
    description_de: Das angehäufte Risiko aus unzureichender oder vernachlässigter Qualitätssicherung, was zu einem fragilen Produkt und langsamer Entwicklungsgeschwindigkeit führt.
    slug_de: testschulden
  testing-complexity:
    title_de: Testkomplexität
    description_de: Die Qualitätssicherung muss dieselbe Funktionalität an mehreren Stellen verifizieren, was den Testaufwand und das Risiko übersehener Fehler erhöht.
    slug_de: testkomplexitaet
  testing-environment-fragility:
    title_de: Brüchigkeit der Testumgebung
    description_de: Die Testinfrastruktur ist unzuverlässig, schwer zu warten und bildet Produktionsbedingungen nicht akkurat ab, was die Testwirksamkeit untergräbt.
    slug_de: bruechigkeit-der-testumgebung
  thread-pool-exhaustion:
    title_de: Erschöpfung des Thread-Pools
    description_de: Alle verfügbaren Threads im Thread-Pool werden durch lang laufende oder blockierte Operationen verbraucht, was die Verarbeitung neuer Aufgaben verhindert.
    slug_de: erschoepfung-des-thread-pools
  tight-coupling-issues:
    title_de: Probleme durch enge Kopplung
    description_de: Komponenten sind übermäßig voneinander abhängig, was Änderungen erschwert und Systemflexibilität und Wartbarkeit verringert.
    slug_de: probleme-durch-enge-kopplung
  time-pressure:
    title_de: Zeitdruck
    description_de: Teams werden gezwungen, Abkürzungen zu nehmen, um unmittelbare Termine einzuhalten, wodurch richtige Lösungen aufgeschoben und wichtige Aufgaben wie Code-Reviews überstürzt werden.
    slug_de: zeitdruck
  tool-limitations:
    title_de: Werkzeugeinschränkungen
    description_de: Unzureichende Entwicklungswerkzeuge verlangsamen gängige Aufgaben und verringern Entwicklerproduktivität und -zufriedenheit.
    slug_de: werkzeugeinschraenkungen
  unbounded-data-growth:
    title_de: Unbegrenztes Datenwachstum
    description_de: Datenstrukturen, Caches oder Datenbanken wachsen unbegrenzt ohne angemessene Bereinigung, Größenlimits oder Archivierungsstrategien.
    slug_de: unbegrenztes-datenwachstum
  unbounded-data-structures:
    title_de: Unbegrenzte Datenstrukturen
    description_de: Datenstrukturen, die ohne angemessene Bereinigung oder Größenlimits unbegrenzt wachsen, was zu Speichererschöpfung und Performance-Verschlechterung führt.
    slug_de: unbegrenzte-datenstrukturen
  unclear-documentation-ownership:
    title_de: Unklare Verantwortlichkeit für Dokumentation
