  development-disruption:
    title_de: Störung der Entwicklung
    description_de: Das Entwicklungsteam wird ständig durch dringende Produktionsprobleme unterbrochen, was geplante Arbeit stört und die Gesamtproduktivität senkt.
    slug_de: stoerung-der-entwicklung
  difficult-code-comprehension:
    title_de: Schwer verständliche Codebasis
    description_de: Eine Situation, in der Entwickler Schwierigkeiten haben, die Codebasis zu verstehen.
    slug_de: schwer-verstaendliche-codebasis
  difficult-code-reuse:
    title_de: Schwierige Code-Wiederverwendung
    description_de: Code lässt sich schwer in anderen Kontexten wiederverwenden, weil er nicht modular und wiederverwendbar gestaltet ist.
    slug_de: schwierige-code-wiederverwendung
  difficult-developer-onboarding:
    title_de: Schwieriges Onboarding neuer Entwickler
    description_de: Neue Teammitglieder brauchen aufgrund komplexer Systeme, schlechter Dokumentation und unzureichender Onboarding-Prozesse ungewöhnlich lange, um produktiv zu werden.
    slug_de: schwieriges-onboarding-neuer-entwickler
  difficult-to-test-code:
    title_de: Schwer testbarer Code
    description_de: Komponenten lassen sich aufgrund enger Kopplung, globaler Abhängigkeiten oder komplexer Voraussetzungen nicht leicht isoliert testen.
    slug_de: schwer-testbarer-code
  difficult-to-understand-code:
    title_de: Schwer verständlicher Code
    description_de: Es ist schwer, den Zweck von Modulen oder Funktionen zu erfassen, ohne viele andere Teile des Systems zu verstehen, was die Entwicklung verlangsamt und Fehler begünstigt.
    slug_de: schwer-verstaendlicher-code
  difficulty-quantifying-benefits:
    title_de: Schwierigkeiten beim Quantifizieren von Nutzen
    description_de: Es ist schwer, den ROI von Refactoring-Arbeit im Vergleich zu neuen Features zu messen, sodass technische Verbesserungen bei Priorisierungsentscheidungen oft den Kürzeren ziehen.
    slug_de: schwierigkeiten-beim-quantifizieren-von-nutzen
  dma-coherency-issues:
    title_de: DMA-Kohärenzprobleme
    description_de: Direct-Memory-Access-Operationen stehen im Konflikt mit der CPU-Cache-Kohärenz, was zu Datenkorruption oder inkonsistenten Datenansichten zwischen CPU und DMA-Geräten führt.
    slug_de: dma-kohaerenzprobleme
  duplicated-effort:
    title_de: Doppelter Aufwand
    description_de: Mehrere Teammitglieder arbeiten unwissentlich an denselben Problemen oder implementieren unabhängig voneinander ähnliche Lösungen.
    slug_de: doppelter-aufwand
  duplicated-research-effort:
    title_de: Doppelter Recherche-Aufwand
    description_de: Mehrere Teammitglieder recherchieren unabhängig voneinander dieselben Themen, was Zeit verschwendet und den Aufbau von kollektivem Wissen verhindert.
    slug_de: doppelter-recherche-aufwand
  duplicated-work:
    title_de: Doppelte Arbeit
    description_de: Mehrere Teammitglieder arbeiten unwissentlich an denselben Aufgaben oder lösen dieselben Probleme, was zu verschwendetem Aufwand und potenziellen Konflikten führt.
    slug_de: doppelte-arbeit
  eager-to-please-stakeholders:
    title_de: Übermäßige Gefälligkeit gegenüber Stakeholdern
    description_de: Das Projektteam stimmt jeder neuen Anfrage der Stakeholder zu, ohne zurückzufragen oder Kompromisse zu erklären, was zu Scope Creep und weiteren Problemen führen kann.
    slug_de: uebermaessige-gefaelligkeit-gegenueber-stakeholdern
  endianness-conversion-overhead:
    title_de: Overhead durch Endianness-Konvertierung
    description_de: Häufige Byte-Reihenfolge-Konvertierungen zwischen unterschiedlichen Endianness-Formaten erzeugen Performance-Overhead bei der Datenverarbeitung und Netzwerkkommunikation.
    slug_de: overhead-durch-endianness-konvertierung
  entity-attribute-value-overuse:
    title_de: Übermäßiger Einsatz von Entity-Attribute-Value
    description_de: Geschäftsdaten werden als generische Attributzeilen statt als typisierte Spalten gespeichert, sodass die Datenbank die gespeicherten Daten nicht mehr erzwingen, indizieren oder erklären kann.
    slug_de: uebermaessiger-einsatz-von-entity-attribute-value
  environment-variable-issues:
    title_de: Probleme mit Umgebungsvariablen
    description_de: Unsachgemäße Verwaltung von Umgebungsvariablen verursacht Konfigurationsprobleme, Sicherheitslücken und Deployment-Fehlschläge.
    slug_de: probleme-mit-umgebungsvariablen
  error-message-information-disclosure:
    title_de: Informationspreisgabe durch Fehlermeldungen
    description_de: Fehlermeldungen geben sensible Systeminformationen preis, die Angreifer nutzen können, um Systemarchitektur und Schwachstellen zu verstehen.
    slug_de: informationspreisgabe-durch-fehlermeldungen
  excessive-class-size:
    title_de: Übermäßige Klassengröße
    description_de: Klassen werden übermäßig groß und komplex, was sie schwer verständlich, wartbar und testbar macht.
    slug_de: uebermaessige-klassengroesse
  excessive-customization:
    title_de: Übermäßige Anpassung
    description_de: So viel kunden- oder standortspezifisches Verhalten häuft sich an, dass keine zwei Installationen gleich sind und jede Änderung gegen jede Variante geprüft werden muss.
    slug_de: uebermaessige-anpassung
  excessive-disk-io:
    title_de: Übermäßige Festplatten-I/O
    description_de: Das System führt eine hohe Anzahl an Festplatten-Lese-/Schreiboperationen aus, was auf ineffizienten Datenzugriff oder ineffiziente Verarbeitung hinweist.
    slug_de: uebermaessige-festplatten-io
  excessive-logging:
    title_de: Übermäßiges Logging
    description_de: Anwendungen erzeugen ein sehr hohes Volumen an Logs, was übermäßigen Speicherplatz verbraucht und potenziell die Performance beeinträchtigt.
    slug_de: uebermaessiges-logging
  excessive-object-allocation:
    title_de: Übermäßige Objektallokation
    description_de: Code erzeugt eine große Anzahl temporärer Objekte, was den Garbage Collector belastet und die Performance verschlechtert.
    slug_de: uebermaessige-objektallokation
  extended-cycle-times:
    title_de: Verlängerte Durchlaufzeiten
    description_de: Die Zeit vom Beginn der Arbeit bis zu ihrer Fertigstellung und Auslieferung wird deutlich länger als die tatsächlich benötigte Arbeitszeit.
    slug_de: verlaengerte-durchlaufzeiten
  extended-research-time:
    title_de: Verlängerte Rechercheszeit
    description_de: Entwickler verbringen einen erheblichen Teil ihres Tages mit Recherche statt mit Umsetzung, aufgrund von Wissenslücken oder komplexen Legacy-Systemen.
    slug_de: verlaengerte-recherchezeit
  extended-review-cycles:
    title_de: Verlängerte Review-Zyklen
    description_de: Code-Reviews erfordern mehrere Runden von Feedback und Überarbeitung, was die Zeit von der Code-Einreichung bis zur Freigabe erheblich verlängert.
    slug_de: verlaengerte-review-zyklen
  external-service-delays:
    title_de: Verzögerungen durch externe Services
    description_de: Eine API hängt von anderen Services (Drittanbieter oder intern) ab, die langsam antworten, was die API selbst langsam macht.
    slug_de: verzoegerungen-durch-externe-services
  false-sharing:
    title_de: False Sharing
    description_de: Mehrere CPU-Kerne greifen auf unterschiedliche Variablen zu, die sich auf derselben Cache-Line befinden, was unnötigen Cache-Kohärenz-Verkehr und Performance-Einbußen verursacht.
    slug_de: false-sharing
  fear-of-breaking-changes:
    title_de: Angst vor Breaking Changes
    description_de: Das Team scheut sich, Änderungen an der Codebasis vorzunehmen, aus Angst, bestehende Funktionalität zu brechen, was zu einem stagnierenden und veralteten System führen kann.
    slug_de: angst-vor-breaking-changes
  fear-of-change:
    title_de: Angst vor Veränderung
    description_de: Entwickler zögern, bestehenden Code zu ändern, aufgrund des hohen Risikos, etwas zu brechen.
    slug_de: angst-vor-veraenderung
  fear-of-conflict:
    title_de: Angst vor Konflikt
    description_de: Reviewer vermeiden es, komplexe Logik oder Designentscheidungen zu hinterfragen, und geben stattdessen einfacheres, weniger konfrontatives Feedback.
    slug_de: angst-vor-konflikt
  fear-of-failure:
    title_de: Angst vor Scheitern
    description_de: Eine allgegenwärtige Angst, Fehler zu machen oder zu scheitern, kann zu Untätigkeit, Risikoscheu und mangelnder Innovationsbereitschaft im Entwicklungsteam führen.
    slug_de: angst-vor-scheitern
  feature-bloat:
    title_de: Feature-Aufblähung
    description_de: Produkte werden durch zahlreiche Funktionen übermäßig komplex, was das Kernwertversprechen verwässert und Nutzer verwirrt.
    slug_de: feature-aufblaehung
  feature-creep-without-refactoring:
    title_de: Feature-Creep ohne Refactoring
    description_de: Die kontinuierliche Ergänzung neuer Funktionen in einer Codebasis, ohne sich Zeit für Refactoring und Designverbesserung zu nehmen.
    slug_de: feature-creep-ohne-refactoring
  feature-creep:
    title_de: Feature-Creep
    description_de: Der Umfang eines Features oder einer Komponente wächst im Laufe der Zeit schrittweise, was zu einem komplexen und aufgeblähten System führt, das schwer zu warten ist.
    slug_de: feature-creep
  feature-factory:
    title_de: Feature-Fabrik
    description_de: Die Organisation priorisiert das Ausliefern von Features gegenüber dem Verständnis ihrer Geschäftswirkung und ihres Nutzerwerts.
    slug_de: feature-fabrik
  feature-gaps:
    title_de: Funktionslücken
    description_de: Wichtige Funktionalität fehlt, weil Entwickler annahmen, sie sei nicht nötig, was zu unvollständigen Lösungen führt, die die Nutzerbedürfnisse nicht erfüllen.
    slug_de: funktionsluecken
  feedback-isolation:
    title_de: Feedback-Isolation
    description_de: Entwicklungsteams arbeiten ohne regelmäßigen Input von Stakeholdern und Nutzern, was zu Produkten führt, die Anforderungen und Nutzerbedürfnisse verfehlen.
    slug_de: feedback-isolation
  flaky-tests:
    title_de: Flaky Tests
    description_de: Tests schlagen zufällig fehl aufgrund von Timing, Setup oder Abhängigkeiten, was das Vertrauen in die Testsuite untergräbt.
    slug_de: flaky-tests
  frequent-changes-to-requirements:
    title_de: Häufige Anforderungsänderungen
    description_de: Die Anforderungen für ein Projekt oder Feature werden ständig aktualisiert, selbst nachdem die Entwicklung begonnen hat, was zu Nacharbeit, Verzögerungen und Frustration führt.
    slug_de: haeufige-anforderungsaenderungen
  frequent-hotfixes-and-rollbacks:
    title_de: Häufige Hotfixes und Rollbacks
    description_de: Das Team deployt ständig kleine Fixes oder macht Releases rückgängig, aufgrund unzureichender Tests und Qualitätskontrolle.
    slug_de: haeufige-hotfixes-und-rollbacks
  garbage-collection-pressure:
    title_de: Garbage-Collection-Druck
    description_de: Übermäßige Objektallokation und -freigabe verursacht häufige Garbage-Collection-Zyklen, was zu Performance-Pausen führt und den Anwendungsdurchsatz verringert.
    slug_de: garbage-collection-druck
  global-state-and-side-effects:
    title_de: Globaler Zustand und Nebeneffekte
    description_de: Übermäßiger Einsatz globaler Variablen oder Funktionen mit versteckten Nebeneffekten erschwert es, das Codeverhalten nachzuvollziehen.
    slug_de: globaler-zustand-und-nebeneffekte
  god-object-anti-pattern:
    title_de: God-Object-Antipattern
    description_de: Einzelne Klassen oder Komponenten übernehmen zu viele Verantwortlichkeiten und werden dadurch übermäßig komplex und schwer zu warten oder zu testen.
    slug_de: god-object-antipattern
  gold-plating:
    title_de: Gold Plating
    description_de: Entwickler fügen einem Projekt unnötige Funktionen oder Komplexität hinzu, weil sie glauben, das würde die Stakeholder beeindrucken, auch wenn es nicht angefragt wurde.
    slug_de: gold-plating
  gradual-performance-degradation:
    title_de: Schleichende Performance-Verschlechterung
    description_de: Die Anwendungsperformance verschlechtert sich im Laufe der Zeit langsam, aufgrund von Ressourcenlecks, angehäuften technischen Schulden oder ineffizienten Algorithmen.
    slug_de: schleichende-performance-verschlechterung
  graphql-complexity-issues:
    title_de: GraphQL-Komplexitätsprobleme
    description_de: GraphQL-Abfragen werden zu komplex oder aufwendig in der Ausführung, was Performance-Probleme und potenzielle Denial-of-Service-Schwachstellen verursacht.
    slug_de: graphql-komplexitaetsprobleme
  growing-task-queues:
    title_de: Wachsende Task-Queues
    description_de: Asynchrone Verarbeitungswarteschlangen häufen unverarbeitete Aufgaben an, was auf einen Engpass in der Verarbeitungspipeline hinweist.
    slug_de: wachsende-task-queues
  hardcoded-values:
    title_de: Hartcodierte Werte
    description_de: Magische Zahlen und feste Zeichenketten verringern die Flexibilität und erschweren Konfiguration und Anpassung.
    slug_de: hartcodierte-werte
  hidden-dependencies:
    title_de: Versteckte Abhängigkeiten
    description_de: Workarounds und Patches erzeugen unerwartete Abhängigkeiten zwischen Systemkomponenten, die aus der Codestruktur nicht ersichtlich sind.
    slug_de: versteckte-abhaengigkeiten
  hidden-side-effects:
    title_de: Versteckte Nebeneffekte
    description_de: Funktionen haben undokumentierte Nebeneffekte, die Zustand verändern oder Aktionen auslösen, die über ihren offensichtlichen Zweck hinausgehen.
    slug_de: versteckte-nebeneffekte
  high-api-latency:
    title_de: Hohe API-Latenz
    description_de: Die Zeit, die eine API zum Antworten auf eine Anfrage benötigt, ist übermäßig lang, was zu schlechter Anwendungsperformance und negativer Nutzererfahrung führt.
    slug_de: hohe-api-latenz
  high-bug-introduction-rate:
    title_de: Hohe Rate an neu eingeführten Fehlern
    description_de: Mit jeder Änderung an der Codebasis werden viele neue Fehler eingeführt, was auf zugrunde liegende Qualitätsprobleme hinweist.
    slug_de: hohe-rate-an-neu-eingefuehrten-fehlern
  high-client-side-resource-consumption:
    title_de: Hoher Ressourcenverbrauch auf Client-Seite
    description_de: Client-Anwendungen verbrauchen übermäßig viel CPU oder Speicher, was zu träger Performance und schlechter Nutzererfahrung führt.
    slug_de: hoher-ressourcenverbrauch-auf-client-seite
  high-connection-count:
    title_de: Hohe Anzahl an Verbindungen
    description_de: Eine große Anzahl offener Datenbankverbindungen, selbst wenn sie inaktiv sind, kann erhebliche Speicherressourcen verbrauchen und zu Verbindungsablehnungen führen.
    slug_de: hohe-anzahl-an-verbindungen
  high-coupling-low-cohesion:
    title_de: Hohe Kopplung und geringe Kohäsion
    description_de: Softwarekomponenten sind übermäßig voneinander abhängig und erfüllen zu viele unzusammenhängende Funktionen, was das System schwer veränderbar und verständlich macht.
    slug_de: hohe-kopplung-und-geringe-kohaesion
  high-database-resource-utilization:
    title_de: Hohe Datenbank-Ressourcennutzung
    description_de: Der Datenbankserver arbeitet durchgängig mit hoher CPU- oder Speichernutzung, was Instabilität riskiert und alle abhängigen Services verlangsamt.
    slug_de: hohe-datenbank-ressourcennutzung
  high-defect-rate-in-production:
    title_de: Hohe Fehlerrate in Produktion
    description_de: Nach einem Release werden in der Produktivumgebung viele Fehler entdeckt, was auf zugrunde liegende Probleme im Entwicklungs- und Qualitätssicherungsprozess hinweist.
    slug_de: hohe-fehlerrate-in-produktion
  high-maintenance-costs:
    title_de: Hohe Wartungskosten
    description_de: Ein unverhältnismäßig großer Teil des Entwicklungsbudgets und -aufwands wird für die Wartung des bestehenden Systems statt für neuen Wert aufgewendet.
    slug_de: hohe-wartungskosten
  high-number-of-database-queries:
    title_de: Hohe Anzahl an Datenbankabfragen
    description_de: Eine einzelne Nutzeranfrage löst eine unerwartet hohe Anzahl an Datenbankabfragen aus, was zu Performance-Verschlechterung und erhöhter Datenbanklast führt.
    slug_de: hohe-anzahl-an-datenbankabfragen
  high-resource-utilization-on-client:
    title_de: Hohe Ressourcennutzung auf dem Client
    description_de: Client-Anwendungen können übermäßig viel CPU oder Speicher verbrauchen, was zu schlechter Nutzererfahrung führt, besonders auf weniger leistungsfähigen Geräten.
    slug_de: hohe-ressourcennutzung-auf-dem-client
  high-technical-debt:
    title_de: Hohe technische Schulden
    description_de: Ansammlung von Design- oder Implementierungsabkürzungen, die langfristig zu erhöhten Kosten und Aufwand führen.
    slug_de: hohe-technische-schulden
  high-turnover:
    title_de: Hohe Fluktuation
    description_de: Neue Entwickler werden frustriert und verlassen das Team aufgrund schlechten Onboardings und Systemkomplexität.
    slug_de: hohe-fluktuation
  history-of-failed-changes:
    title_de: Geschichte fehlgeschlagener Änderungen
    description_de: Eine vergangene Historie fehlgeschlagener Deployments oder Änderungen erzeugt eine Kultur der Angst und des Widerstands gegen künftige Änderungen.
    slug_de: geschichte-fehlgeschlagener-aenderungen
  immature-delivery-strategy:
    title_de: Unausgereifte Auslieferungsstrategie
    description_de: Software-Rollout-Prozesse sind improvisiert, inkonsistent oder unzureichend geplant, was Ausfallzeiten und Nutzerverwirrung erhöht.
    slug_de: unausgereifte-auslieferungsstrategie
  imperative-data-fetching-logic:
    title_de: Imperative Datenabruflogik
    description_de: Der Anwendungscode ist so geschrieben, dass Daten in einer Schleife abgerufen werden, statt einen effizienteren, deklarativen Ansatz zu nutzen, was zu Performance-Problemen führt.
    slug_de: imperative-datenabruflogik
  implementation-partner-dependency:
    title_de: Abhängigkeit vom Implementierungspartner
    description_de: Nur die externe Beratungsfirma versteht, wie das System aufgebaut wurde, sodass die Organisation ihre eigene Installation ohne sie nicht ändern, bewerten oder verlassen kann.
    slug_de: abhaengigkeit-vom-implementierungspartner
  implementation-rework:
    title_de: Implementierungs-Nacharbeit
    description_de: Funktionen müssen neu gebaut werden, wenn sich das anfängliche Verständnis als falsch erweist, was Entwicklungsaufwand verschwendet und die Auslieferung verzögert.
    slug_de: implementierungs-nacharbeit
  implementation-starts-without-design:
    title_de: Implementierung beginnt ohne Design
    description_de: Die Entwicklung beginnt mit unklarer Struktur, was zu unorganisiertem Code und architektonischer Drift führt.
    slug_de: implementierung-beginnt-ohne-design
  implicit-knowledge:
    title_de: Implizites Wissen
    description_de: Kritisches Systemwissen existiert als ungeschriebene Annahmen, Stammeswissen und undokumentierte Praktiken, statt explizit festgehalten zu sein.
    slug_de: implizites-wissen
  improper-event-listener-management:
    title_de: Unsachgemäße Verwaltung von Event-Listenern
    description_de: Event-Listener werden hinzugefügt, aber nicht entfernt, wenn zugehörige Objekte zerstört werden, was Speicherlecks erzeugt und Garbage Collection verhindert.
    slug_de: unsachgemaesse-verwaltung-von-event-listenern
  inability-to-innovate:
    title_de: Unfähigkeit zu innovieren
    description_de: Das Team ist so sehr mit alltäglichen Wartungsaufgaben beschäftigt, dass es keine Zeit hat, über zukünftige Verbesserungen oder neue Ansätze nachzudenken.
    slug_de: unfaehigkeit-zu-innovieren
  inadequate-code-reviews:
    title_de: Unzureichende Code-Reviews
    description_de: Code-Reviews werden nicht konsistent durchgeführt, sind übereilt, oberflächlich oder erkennen kritische Probleme nicht, was die Codequalität senkt und das Risiko erhöht.
    slug_de: unzureichende-code-reviews
  inadequate-configuration-management:
    title_de: Unzureichendes Konfigurationsmanagement
    description_de: Versionen von Code, Daten oder Infrastruktur werden nicht ordentlich nachverfolgt, was zu Fehlern oder Problemen bei Rollbacks führt.
    slug_de: unzureichendes-konfigurationsmanagement
  inadequate-error-handling:
    title_de: Unzureichende Fehlerbehandlung
    description_de: Schlechte Fehlerbehandlungsmechanismen schaffen es nicht, Ausnahmen geordnet zu handhaben, was zu Anwendungsabstürzen und schlechter Nutzererfahrung führt.
    slug_de: unzureichende-fehlerbehandlung
  inadequate-initial-reviews:
    title_de: Unzureichende Erst-Reviews
    description_de: Code-Reviews der ersten Runde sind unvollständig oder oberflächlich und erkennen wichtige Probleme nicht, die erst in späteren Review-Runden entdeckt werden.
    slug_de: unzureichende-erst-reviews
  inadequate-integration-tests:
    title_de: Unzureichende Integrationstests
    description_de: Die Interaktionen zwischen verschiedenen Modulen oder Services werden nicht gründlich getestet, was zu Integrationsfehlern führt.
    slug_de: unzureichende-integrationstests
  inadequate-mentoring-structure:
    title_de: Unzureichende Mentoring-Struktur
    description_de: Der Organisation fehlt ein systematischer Ansatz für das Mentoring neuer Entwickler, was zu uneinheitlicher Anleitung und Unterstützung führt.
    slug_de: unzureichende-mentoring-struktur
  inadequate-onboarding:
    title_de: Unzureichendes Onboarding
    description_de: Neue Nutzer haben Schwierigkeiten zu verstehen, wie die Anwendung zu nutzen ist, was zu frühzeitiger Abwanderung führt.
    slug_de: unzureichendes-onboarding
  inadequate-requirements-gathering:
    title_de: Unzureichende Anforderungserhebung
    description_de: Unzureichende Analyse und Dokumentation von Anforderungen führt zu Lösungen, die tatsächliche Bedürfnisse nicht erfüllen.
    slug_de: unzureichende-anforderungserhebung
  inadequate-test-data-management:
    title_de: Unzureichendes Testdatenmanagement
    description_de: Die Nutzung unrealistischer, veralteter oder unzureichender Testdaten führt zu Tests, die reale Szenarien nicht akkurat abbilden.
    slug_de: unzureichendes-testdatenmanagement
  inadequate-test-infrastructure:
    title_de: Unzureichende Testinfrastruktur
    description_de: Fehlende Werkzeuge, Umgebungen oder Automatisierung machen gründliches Testen langsam oder unmöglich.
    slug_de: unzureichende-testinfrastruktur
  inappropriate-skillset:
    title_de: Unpassendes Fähigkeitsprofil
    description_de: Teammitgliedern fehlt wesentliches Wissen oder Erfahrung, das für ihre zugewiesenen Rollen und Verantwortlichkeiten nötig ist.
    slug_de: unpassendes-faehigkeitsprofil
  incomplete-knowledge:
    title_de: Unvollständiges Wissen
    description_de: Entwicklern ist nicht bewusst, an welchen Stellen überall ähnliche Logik existiert, was zu Synchronisationsproblemen und anderen Schwierigkeiten führen kann.
    slug_de: unvollstaendiges-wissen
  incomplete-projects:
    title_de: Unvollständige Projekte
    description_de: Funktionen werden begonnen, aber aufgrund sich verändernder Prioritäten nie fertiggestellt, was zu erheblichem verschwendetem Aufwand und Frustration im Entwicklungsteam führt.
