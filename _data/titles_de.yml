  deadlock-conditions:
    title_de: Deadlock-Zustände
    description_de: Mehrere Threads oder Prozesse warten unbegrenzt darauf, dass der jeweils andere Ressourcen freigibt, was zum Einfrieren des Systems und zur Nichtreaktion der Anwendung führt.
    slug_de: deadlock-zustaende
  debugging-difficulties:
    title_de: Debugging-Schwierigkeiten
    description_de: Das Finden und Beheben von Fehlern wird durch komplexe Code-Architektur, schlechtes Logging oder unzureichende Entwicklungswerkzeuge erschwert.
    slug_de: debugging-schwierigkeiten
  decision-avoidance:
    title_de: Entscheidungsvermeidung
    description_de: Wichtige technische Entscheidungen werden wiederholt aufgeschoben, was Fortschritt verhindert und Engpässe in der Entwicklungsarbeit erzeugt.
    slug_de: entscheidungsvermeidung
  decision-paralysis:
    title_de: Entscheidungslähmung
    description_de: Entwickler tun sich schwer, ohne klare Vorgaben Entscheidungen zu treffen, was die Entwicklung verlangsamt und für viel Frustration im Team sorgt.
    slug_de: entscheidungslaehmung
  declining-business-metrics:
    title_de: Sinkende Geschäftskennzahlen
    description_de: Wichtige Geschäftskennzahlen wie Nutzerbindung, Konversionsraten, Umsatz und Stakeholder-Vertrauen verschlechtern sich aufgrund technischer Probleme.
    slug_de: sinkende-geschaeftskennzahlen
  defensive-coding-practices:
