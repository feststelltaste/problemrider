  bikeshedding:
    title_de: Bikeshedding
    description_de: Reviewer konzentrieren sich auf triviale Punkte wie Leerzeichen und Variablennamen, statt auf wesentliche Designfragen.
    slug_de: bikeshedding
  blame-culture:
    title_de: Schuldzuweisungskultur
    description_de: Fehler werden bestraft statt konstruktiv angegangen, was Risikobereitschaft und Offenheit entmutigt.
