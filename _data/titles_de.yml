    description_de: Hunderte maßgeschneiderter Reports, Formulare und Extrakte häufen sich an, ohne Aufzeichnung, wer sie nutzt oder warum.
    slug_de: wildwuchs-an-individuellen-reports
  customer-dissatisfaction:
    title_de: Kundenunzufriedenheit
