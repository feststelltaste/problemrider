    description_de: Unzureichende Eingabevalidierung und Ausgabekodierung erlaubt Angreifern, bösartigen Code einzuschleusen.
    slug_de: cross-site-scripting-schwachstellen
  cross-system-data-synchronization-problems:
    title_de: Probleme bei der systemübergreifenden Datensynchronisation
    description_de: Die Aufrechterhaltung der Datenkonsistenz zwischen Legacy- und modernen Systemen während der Migration ist schwierig.
    slug_de: probleme-bei-der-systemuebergreifenden-datensynchronisation
  custom-report-sprawl:
    title_de: Wildwuchs an individuellen Reports
    description_de: Hunderte maßgeschneiderter Reports, Formulare und Extrakte häufen sich an, ohne Aufzeichnung, wer sie nutzt oder warum.
    slug_de: wildwuchs-an-individuellen-reports
  customer-dissatisfaction:
