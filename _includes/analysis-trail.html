<aside class="analysis-trail" aria-labelledby="analysis-trail-title" data-analysis-trail>
  <div class="analysis-trail__header">
    <div>
      <h2 id="analysis-trail-title">Analysis Workbench</h2>
      <label class="analysis-trail__speed-nav">
        <input type="checkbox" data-analysis-trail-speed-nav>
        <span>Speed nav<small>Number keys jump<br>to headings</small></span>
      </label>
      <p id="analysis-trail-summary" class="analysis-trail__summary">Open a problem or solution to start.</p>
    </div>
    <div class="analysis-trail__actions" aria-label="Analysis trail controls">
      <button type="button" class="analysis-trail__zoom" data-analysis-trail-zoom-out aria-label="Zoom out">−</button>
      <button type="button" class="analysis-trail__zoom" data-analysis-trail-zoom-in aria-label="Zoom in">+</button>
      <button type="button" class="analysis-trail__zoom" data-analysis-trail-undo aria-label="Undo graph change">↶</button>
      <button type="button" class="analysis-trail__zoom" data-analysis-trail-redo aria-label="Redo graph change">↷</button>
      <button type="button" class="analysis-trail__mode" data-analysis-trail-export aria-label="Download graph as SVG">SVG</button>
      <button type="button" class="analysis-trail__mode" data-analysis-trail-mode aria-pressed="false">Close</button>
      <button type="button" class="analysis-trail__reset" data-analysis-trail-reset>Reset</button>
    </div>
  </div>
  <div class="analysis-trail__graph" data-analysis-trail-graph aria-live="polite"></div>
  <ul class="analysis-trail__legend" aria-label="Connection legend">
    <li><span class="analysis-trail__legend-line analysis-trail__legend-line--causes"></span>Causes</li>
    <li><span class="analysis-trail__legend-line analysis-trail__legend-line--addresses"></span>Addresses</li>
    <li><span class="analysis-trail__legend-line analysis-trail__legend-line--similar"></span>Similar</li>
  </ul>
  <p class="analysis-trail__hint">Your path is saved in this browser tab. Select a node to return to it.</p>
</aside>

<script src="{{ '/assets/js/analysis-trail.js' | relative_url }}" defer></script>
