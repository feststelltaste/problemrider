<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {% if page.collection == 'problems' or page.collection == 'solutions' %}
        <div class="page-with-analysis-trail">
          <div class="page-main-content">
            {{ content }}
          </div>
          {%- include analysis-trail.html -%}
        </div>
        {% else %}
          {{ content }}
        {% endif %}
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
